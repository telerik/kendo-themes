<!doctype html>
<html><head><meta charset="utf-8"><title>Token explorer</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--fg:#1b1f24;--mut:#6a727c;--bd:#e3e6ea;--bd2:#eef0f2;--ac:#2f6fed;--acbg:#e8f0ff;--hov:#f2f4f7;--sh:rgba(0,0,0,.35);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#161b22;--fg:#e8ecf1;--mut:#8b949e;--bd:#2a313a;--bd2:#222830;--ac:#5b9bff;--acbg:#1a2740;--hov:#1d232b;--sh:rgba(255,255,255,.3);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding:12px max(20px,calc((100% - 1520px)/2 + 20px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.title{font-size:15px;font-weight:650;letter-spacing:-.01em;margin-right:4px}
.tabs{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;background:linear-gradient(to right,var(--hov) 30%,transparent) left center/24px 100% no-repeat local,linear-gradient(to left,var(--hov) 30%,transparent) right center/24px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,var(--sh),transparent) left center/14px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,var(--sh),transparent) right center/14px 100% no-repeat scroll,var(--hov);border:1px solid var(--bd);border-radius:9px;padding:2px}
.tabs button{flex:none;white-space:nowrap;font:inherit;font-weight:500;border:0;background:transparent;color:var(--mut);padding:5px 12px;border-radius:7px;cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--bd)}
select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;outline:none}
select{font-weight:600;cursor:pointer}
.dd{position:relative;flex:none}
.ddb{font:inherit;font-weight:600;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 30px 6px 10px;cursor:pointer;position:relative;text-align:left}
.ddb::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border:solid var(--mut);border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg)}
.ddb:hover{background:var(--hov)}
.ddb:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.1);z-index:20}
.ddm li{padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:14px}
.ddm li:hover,.ddm li.act{background:var(--hov)}
.ddm li[aria-selected=true]{color:var(--ac);font-weight:650}
.ddm li[aria-selected=true]::after{content:"✓"}
input{flex:0 1 200px;min-width:110px;width:auto;margin-left:auto}
@media (max-width:1100px) and (min-width:961px){.tabs button{padding:5px 8px}input{flex:0 1 150px;min-width:100px}header{gap:10px}}
.title{white-space:nowrap}
select{flex:none}
@media (max-width:960px){.tabs{order:3;flex:1 1 100%}.tabs button{flex:1 0 auto;text-align:center}input{flex:1 1 140px;max-width:none}}
select:focus-visible,input:focus-visible,.tabs button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{max-width:1520px;margin:0 auto;padding:24px 20px 56px}
.sec{margin:0 0 28px}
.sec>h3{margin:0 0 10px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);display:flex;gap:8px;align-items:baseline}
.sec>h3 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;opacity:.8}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
code,.mono{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace}
code{color:var(--mut)}
.row{display:grid;align-items:center;height:44px;padding:0 16px;border-top:1px solid var(--bd2)}
.row:first-child{border-top:0}
.row:hover{background:var(--acbg)}
.row .k{font-weight:600}
.row .v{color:var(--mut);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{grid-template-columns:140px 96px 1fr minmax(0,300px);gap:16px}
.sp .k{white-space:nowrap}
.sp .px{font-variant-numeric:tabular-nums}
.bar{height:16px;border-radius:4px;background:var(--ac);min-width:1px}
.cl{grid-template-columns:36px 150px minmax(0,1fr) minmax(0,300px);gap:14px}
.sw{width:28px;height:28px;border-radius:7px;border:1px solid var(--bd);position:relative;overflow:hidden}
.sw i{position:absolute;inset:0}
.cl.both{grid-template-columns:130px 36px minmax(0,1fr) 36px minmax(0,1fr) minmax(0,230px);gap:14px}
@media (max-width:1100px){.cl.both{grid-template-columns:130px 36px minmax(0,1fr) 36px minmax(0,1fr)}.cl.both>:nth-child(6){display:none}}
@media (max-width:760px){
.cl.both,.cl.both.lbl{grid-template-columns:36px minmax(0,1fr) 36px minmax(0,1fr);gap:4px 12px;align-items:center}
.cl.both:not(.lbl){height:auto;padding-top:10px;padding-bottom:10px}
.cl.both:not(.lbl) .name{grid-column:1/-1}
.cl.both .sw{grid-row:auto;margin:0;align-self:center}
.cl.both.lbl>:empty{display:none}
.cl.both.lbl{padding:0 17px;height:24px;min-height:0}
.cl.both.lbl>:nth-child(3){grid-column:1/3}
.cl.both.lbl>:nth-child(5){grid-column:3/5}
}
@media (max-width:640px){
.cl.lbl{padding:0 12px!important;min-height:0;height:24px;display:flex;align-items:center}
.cl.lbl:not(.both)>:empty{display:none}
.cl.both.lbl{display:grid}
}
.cl.lbl{border-top:0;height:24px;margin-bottom:4px;padding:0 17px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.cl.lbl:hover{background:transparent}
.cl .name{font-weight:600}
.cl .hex{display:flex;gap:6px;align-items:center}
.cl .hex{color:var(--fg);font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.cl .hex .ht{min-width:0}
.cpb{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:600;color:var(--ac);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:3px 10px;cursor:pointer;align-self:center}
.cpb:hover{background:var(--acbg);border-color:var(--ac)}
.cpb .ci{opacity:1;color:var(--ac);display:inline-flex;align-items:center}
.cpb .ci svg{display:block}
.cpb.done .ci{color:#1a9a4b}
span.cpv,code.cpv,div.cpv{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.row .v.cpv{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .v.cpv{display:block;width:fit-content;max-width:100%;margin:-3px 0 -3px -6px;padding:3px 6px;justify-self:start}
.ec code.cpv{margin:8px 0 0 -6px}
.cv .v.cpv .ci{display:inline-flex;vertical-align:middle;margin-left:6px}
.row .v.cpv .ci{margin-right:6px;vertical-align:middle}
.cpv{justify-self:start;width:fit-content;max-width:100%;font:inherit;border:0;background:transparent;cursor:pointer;text-align:left;padding:3px 6px;margin:-3px -6px;border-radius:6px;min-width:0}
.cpv:hover,.cpv:focus-visible{background:var(--hov)}
.cpv .ci{display:inline-flex;color:var(--mut);opacity:0;transition:opacity .12s;flex:none}
.cpv:hover .ci,.cpv:focus-visible .ci,.cpv.done .ci{opacity:1}
.cpv.done .ci{color:#1a9a4b}
@media (hover:none){.cpv .ci{opacity:1}}
.cl .tokv{color:var(--mut);text-align:right}
.gtitle{padding:12px 16px 10px;font-weight:650;display:flex;gap:8px;align-items:baseline;background:var(--hov);border-bottom:1px solid var(--bd)}
.gtitle code{font-weight:400}
.radg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.rt{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;height:164px;display:flex;flex-direction:column;gap:8px}
.rt .shape{height:80px;flex:none;background:var(--acbg);border:2px solid var(--ac)}
.rt b{display:block}
.rt code{display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:4px;min-width:0}
.rt code.cpv{margin:4px 0 0 -6px;align-self:flex-start}
.rt code>span:first-child{overflow:hidden;text-overflow:ellipsis}
.stage{background:#fff;color:#1b1f24;border:1px solid var(--bd);border-radius:16px;padding:44px 32px 36px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:36px 24px}
.lv{display:flex;flex-direction:column;gap:14px}
.lv .card{height:104px;border-radius:12px;background:#e8f0ff;border:1px solid #5b9bff;color:#1b1f24;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:13px}
.lv code{color:#6a727c;font-size:10.5px;line-height:1.45;word-break:break-word}
.ty{grid-template-columns:230px 1fr;gap:16px;min-height:52px;height:auto;padding-top:8px;padding-bottom:8px}
.ty .l{display:flex;flex-direction:column;gap:6px}
.ty .l span{color:var(--mut)}
.ty .smp{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ty .smp.wrap{white-space:normal}
.lh{background:var(--hov);border-radius:6px;max-width:300px;padding:0 8px}
.mo-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mo-bar button,.play{font:inherit;font-weight:500;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;cursor:pointer}
.mo-bar button:hover,.play:hover{background:var(--hov)}
.du{grid-template-columns:260px 70px 1fr;gap:16px}
.track{position:relative;height:24px;border-radius:12px;background:var(--bg);border:1px solid var(--bd)}
.dot{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--ac)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.ec:hover{border-color:var(--ac)}
.ball{fill:var(--ac)}
.ec>svg{width:100%;height:130px;background:var(--bg);border-radius:8px;display:block}
.curve{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round}
.grid{stroke:var(--bd);stroke-width:1}
.ec b{display:block}
.tr{grid-template-columns:260px 90px 120px 1fr;gap:16px;height:auto;padding:6px 14px}
.trm{display:flex;flex-direction:column;gap:2px}
.tr svg{width:120px;height:72px;background:var(--bg);border-radius:8px}
.cg{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.cg>summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-weight:650;list-style:none;user-select:none}
.cg>summary::-webkit-details-marker{display:none}
.cg>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s}
.cg[open]>summary::before{transform:rotate(45deg)}
.cg>summary:hover{background:var(--acbg)}
.cg .cnt{font-weight:500;color:var(--mut);font-size:12px;background:var(--hov);border-radius:10px;padding:1px 8px}
.cv{display:grid;grid-template-columns:minmax(260px,36%) minmax(120px,24%) 1fr 84px;gap:16px;padding:9px 16px;border-top:1px solid var(--bd2);align-items:start}
.cv:hover{background:var(--acbg)}
.cv .n{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;word-break:break-all}
.cv .v{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ac);word-break:break-word;max-height:4.2em;overflow:hidden}
.cv .d{color:var(--mut);font-size:12px;line-height:1.45}
.cv.h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--hov);padding:6px 16px}
.cv.h:hover{background:var(--hov)}
.tabs[hidden]{display:none}
.empty{color:var(--mut);padding:60px;text-align:center;white-space:pre-line}
.rf{display:grid;place-items:center;width:34px;height:34px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;cursor:pointer;flex:none}
.rf:hover{background:var(--hov)}.rf.bad{color:#f85149;border-color:#f85149}.rf:disabled{cursor:default}.rf svg{width:16px;height:16px}.rf.spin svg{animation:rfs .8s linear infinite}
@keyframes rfs{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.rf.spin svg{animation-duration:2s}}
.mo-bar{flex-wrap:wrap}
.eg{grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))}
@media (max-width:900px){
.cl{grid-template-columns:36px 130px minmax(0,1fr) minmax(0,200px)}
.sp{grid-template-columns:130px 60px 1fr}
.sp .v{display:none}
.du{grid-template-columns:200px 60px 1fr}
.tr{grid-template-columns:200px 80px 120px 1fr}
.cv{grid-template-columns:minmax(200px,38%) minmax(100px,22%) 1fr 84px}
}
@media (max-width:640px){
header{padding:10px 12px;gap:10px}
main{padding:16px 12px 40px}
.row{height:auto;min-height:44px;padding:8px 12px}
.sp{grid-template-columns:1fr auto auto;gap:6px 12px}
.sp>div{grid-column:1/-1;grid-row:2}
.sp .v{display:none}
.cl{grid-template-columns:36px minmax(0,1fr);gap:2px 12px}
.cl .sw{grid-row:1/4;align-self:start;margin-top:2px}
.cl .hex,.cl .tokv,.cl .mono{white-space:normal;word-break:break-word;text-align:left}
.ty{grid-template-columns:1fr;gap:6px}
.du{grid-template-columns:1fr auto;gap:8px 12px}
.du .track{grid-column:1/-1}
.tr{grid-template-columns:120px minmax(0,1fr);gap:6px 14px}
.tr>.k{grid-column:1/-1}
.tr>svg{grid-row:2/4}
.trm{flex-direction:row;align-items:baseline;gap:10px;align-self:end}
.tr .track{align-self:start}
.cv{grid-template-columns:1fr;gap:4px;padding:10px 12px}
.cv .cmp{justify-self:start}
.cv.h{display:none}
.cv .v{max-height:none}
.cg>summary{padding:12px}
.stage{padding:24px 14px;gap:24px 14px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.radg{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.gtitle{flex-wrap:wrap}
}

.cmp{font:inherit;font-size:12px;font-weight:600;color:var(--ac);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:3px 10px;cursor:pointer;justify-self:end}
.cmp:hover{background:var(--acbg);border-color:var(--ac)}
.cmp:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.mdl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mdl .box{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(760px,100%);padding:18px 20px}
.mdl h2{margin:0 0 6px;font:600 15px ui-monospace,Menlo,monospace;word-break:break-all;padding-right:28px}
.mdl .meta{color:var(--mut);font-size:12px;margin-bottom:8px}
.mdl .x{position:absolute;right:14px;top:12px;font-size:20px;line-height:1;border:0;background:transparent;color:var(--mut);cursor:pointer;padding:4px 8px;border-radius:6px}
.mdl .x:hover{background:var(--hov);color:var(--fg)}
.mdl .bx{position:relative;width:min(760px,100%)}
.mdl .desc{margin:0 0 12px;font-size:13px}
.mdl table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.mdl th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--hov);padding:9px 14px;border:0;border-bottom:1px solid var(--bd)}
.mdl td{padding:10px 14px;border:0;border-top:1px solid var(--bd2);vertical-align:top;font-family:ui-monospace,Menlo,monospace;color:var(--ac);word-break:break-word}
.mdl tr:first-child td,.mdl tr:first-child+tr td{border-top:0}
.mdl tr:hover td{background:var(--acbg)}
.mdl td:first-child{font-family:inherit;font-weight:600;white-space:nowrap;color:var(--fg)}
.mdl tr.sel-r{cursor:pointer}
.mdl tr.sel-r.base td{background:var(--acbg);box-shadow:inset 3px 0 0 var(--ac) ;}
.mdl tr.sel-r.base td:not(:first-child){box-shadow:none}
.mdl tr.sel-r.diff td{background:rgba(255,190,0,.18)}
.mdl tr.sel-r.diff:hover td{background:rgba(255,190,0,.26)}
.mdl tr.sel-r:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.mdl .hint{margin-top:10px;font-size:12px;color:var(--mut)}
.mdl .tag{display:inline-block;font:600 11px system-ui,sans-serif;padding:1px 8px;border-radius:10px;margin-left:6px;background:var(--hov);color:var(--mut)}
.mdl .tag.w{background:rgba(255,180,0,.2);color:inherit}
.fseg{margin-left:auto;align-self:center;text-transform:none;letter-spacing:0;display:inline-flex;gap:2px;background:var(--hov);border:1px solid var(--bd);border-radius:8px;padding:2px}
.fseg button{font:inherit;font-size:12px;font-weight:500;border:0;background:transparent;color:var(--mut);padding:3px 10px;border-radius:6px;cursor:pointer}
.fseg button:hover{color:var(--fg)}
.tl-stage{position:relative;border:1px solid var(--bd);border-radius:12px;padding:40px 28px 28px;overflow:hidden;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;--kendo-translucency-base:50%}
.tl-stage.solid{background:var(--kendo-color-primary)}
.tl-stage.gradient{background:linear-gradient(45deg,var(--kendo-color-primary),var(--kendo-color-secondary))}
.tl-stage.pattern{background:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%) -24px 0/48px 48px,linear-gradient(225deg,rgba(255,255,255,.28) 25%,transparent 25%) -24px 0/48px 48px,linear-gradient(315deg,rgba(0,0,0,.14) 25%,transparent 25%) 0 0/48px 48px,linear-gradient(45deg,rgba(0,0,0,.14) 25%,transparent 25%) 0 0/48px 48px,linear-gradient(45deg,var(--kendo-color-primary),var(--kendo-color-secondary))}
.tl-lv{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.tl-lv code{font-size:12px;color:var(--fg);background:rgba(255,255,255,.7);color:#1b1f24;border-radius:6px;padding:2px 6px;align-self:flex-start}
.tl-wrap{position:relative}
.tl-back{position:absolute;left:0;right:0;top:18px;font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em;color:#1b1f24;white-space:nowrap;overflow:hidden;text-align:center}
.tl-card{position:relative;height:130px;font-size:11px;border-radius:12px;border:1px solid rgba(255,255,255,.45);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:600;color:var(--kendo-color-on-app-surface,#1b1f24);background:oklch(from var(--kendo-color-surface) l c h / calc(100% - calc(var(--kendo-translucency-base,0%))))}
.row.tu{height:auto;grid-template-columns:180px 1fr;gap:16px;align-items:start;padding:10px 16px}
.tu .tc{display:flex;flex-wrap:wrap;gap:6px;flex-direction:column;align-items:flex-start}
.tu .tsl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tu .tc code.tb{background:var(--acbg);color:var(--ac)}
.tu .tc code.tg{background:transparent;border:1px dashed var(--bd);color:var(--mut)}
.tu .tc code{background:var(--hov);border-radius:6px;padding:2px 8px;font-size:12px}
@media (max-width:640px){.row.tu{grid-template-columns:1fr;gap:6px}}
.tl-ctl{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 10px;min-width:0;max-width:100%;font-size:12px;color:var(--mut)}
.tl-ctl input[type=range]{padding:0;width:140px;min-width:80px;flex:1 1 100px;max-width:200px;accent-color:var(--ac)}
.tl-ctl output{min-width:34px;text-align:right;font-family:ui-monospace,Menlo,monospace;color:var(--fg)}
@media (max-width:760px){.sec>h3:has(.tl-ctl){flex-wrap:wrap}.sec>h3 .tl-ctl{margin-left:0;width:100%;justify-content:flex-start}.tl-ctl input[type=range]{max-width:none}}

  ball.animate([{transform:"translateY(0)"},{transform:"translateY("+(-dy)+"px)"}],{duration:ms,easing:v,fill:"both"})};

function motion(T){
 const M=motionMaps(T);PLAYERS.length=0;
 const bar=el("div","mo-bar");const b=el("button",0,"▶ Replay all");b.onclick=play;bar.appendChild(b);

   const info=el("div");info.appendChild(el("b",0,"k-easing("+k+")"));{const ec=el("code");ec.appendChild(el("span",0,v));copyable(ec,()=>v);info.appendChild(ec)}c.appendChild(info);

   r.onclick=run;PLAYERS.push(run);p.appendChild(r)}

function compare(name){
 const ov=el("div","mdl");const bx=el("div","bx");const box=el("div","box");bx.appendChild(box);ov.appendChild(bx);
 const x=el("button","x","×");x.setAttribute("aria-label","Close");box.appendChild(x);
 const close=()=>{ov.remove();document.removeEventListener("keydown",esc)};
 const esc=e=>{if(e.key==="Escape")close()};
 document.addEventListener("keydown",esc);x.onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
 box.appendChild(el("h2",0,"$"+name));box.appendChild(el("div","meta","Loading…"));document.body.appendChild(ov);x.focus();
 fetch("/api/compare?name="+encodeURIComponent(name)).then(r=>r.json()).then(d=>{
  box.querySelector(".meta").remove();
  const vals=d.rows.map(r=>r.computed);const diff=new Set(vals.filter(v=>v!=null)).size>1;
  const m=el("div","meta",pretty(d.group)+" · "+(d.type||"—"));if(diff)m.appendChild(el("span","tag w","differs"));
  m.appendChild(el("span","tag",d.rows.filter(r=>r.computed!=null).length+" themes"));box.appendChild(m);
  if(d.description)box.appendChild(el("p","desc",d.description));
  const t=el("table");const hr=el("tr");for(const c of ["Theme","Default","Computed"])hr.appendChild(el("th",0,c));t.appendChild(hr);
  for(const r of d.rows){const tr=el("tr");tr.appendChild(el("td",0,pretty(r.theme)));
   const miss=r.computed==null;
   for(const k of ["source","computed"]){const td=el("td",0,miss?"—":(r[k]===""?"—":r[k]));tr.appendChild(td)}
   tr.className="sel-r";tr.tabIndex=0;tr.title="Click to highlight themes that differ from this one";tr._v=r.computed;
   t.appendChild(tr)}
  const rowsEl=[...t.querySelectorAll("tr.sel-r")];
  const pick=tr=>{const on=tr.classList.contains("base");
   rowsEl.forEach(x=>{x.classList.remove("base","diff")});
   if(on){return}
   tr.classList.add("base");
   rowsEl.forEach(x=>{if(x!==tr&&x._v!==tr._v){x.classList.add("diff")}})};
  rowsEl.forEach(tr=>{tr.onclick=()=>pick(tr);tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(tr)}}});
  box.appendChild(t);
  box.appendChild(el("div","hint","Select a theme to highlight the ones that differ from it"));
 }).catch(()=>{box.querySelector(".meta").textContent="Failed to load"});
}
let COMP={},TL={};const OPEN=new Set();
const pretty=id=>id.split("-").map(w=>w[0].toUpperCase()+w.slice(1)).join(" ");
function components(T){
 const L=COMP[st.theme];
 if(!L){
  fetch("/api/components?theme="+st.theme).then(r=>r.json()).then(d=>{COMP[st.theme]=d;if(st.cat==="components")render()});
  sc.appendChild(el("div","empty","Loading component variables…"));return 1;
 }
 const total=L.reduce((a,g)=>a+g.vars.length,0);
 const bar=el("div","mo-bar");
 const all=el("button",0,"Expand all"),none=el("button",0,"Collapse all");
 bar.append(all,none,el("code",0,L.length+" components · "+total+" variables"));sc.appendChild(bar);
 const groups=[];let n=0;
 for(const g of L){
  const title=pretty(g.id);
  const vars=g.vars.filter(v=>match(v.name,v.value,v.description,title));
  if(!vars.length)continue;n+=vars.length;
  const d=el("details","cg");d.open=OPEN.has(g.id)||(!!st.q&&vars.length<=40);
  const sm=el("summary");sm.appendChild(el("span",0,title));sm.appendChild(el("span","cnt",String(vars.length)));d.appendChild(sm);
  const fill=()=>{
   if(d.dataset.f)return;d.dataset.f=1;
   const h=el("div","cv h");h.append(el("span",0,"Variable"),el("span",0,"Value"),el("span",0,"Description"),el("span"));d.appendChild(h);
   for(const v of vars){
    const r=el("div","cv");r.append(el("span","n","$"+v.name));
    const val=el("span","v");val.appendChild(el("span",0,v.value));copyable(val,()=>v.value);val.title=v.value;r.appendChild(val);
    r.appendChild(el("span","d",v.description));

  };
  d.addEventListener("toggle",()=>{if(d.open)fill()});sm.addEventListener("click",()=>setTimeout(()=>{d.open?OPEN.add(g.id):OPEN.delete(g.id)}));d.dataset.id=g.id;if(d.open)fill();
  sc.appendChild(d);groups.push(d);

 return n;
