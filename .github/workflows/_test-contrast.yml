name: CI | A11y

on:
  workflow_call:
    inputs:
      max-chunks:
        required: false
        type: number
        default: 1

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      chunk-var: ${{ steps.generate-matrix.outputs.MATRIX }}

    steps:

      - id: generate-matrix
        run: |
          MATRIX=$(echo $(seq ${{ inputs.max-chunks }}) | sed 's/ /, /g')
          MATRIX="[ $MATRIX ]"

          echo $MATRIX
          echo "MATRIX=$MATRIX" >> $GITHUB_OUTPUT

  run-checks:
    runs-on: ubuntu-latest
    needs: [ prepare ]

    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunk-var) }}
        swatch: [ meridian-main, meridian-main-dark ]

    steps:

      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Install virtual display on Linux
        run: sudo apt-get install xvfb

      - name: Setup and Install dependencies
        uses: ./.github/actions/setup

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: .tmp

      - name: Unpack artifacts
        run: find .tmp -name "*.tar" -type f -exec tar -xf {} \;

      - name: Test contrast (${{ matrix.swatch }} — ${{ matrix.chunk }} of ${{ inputs.max-chunks }})
        run: xvfb-run --auto-servernum --server-args="-screen 0, 1366x768x24" npm run test:contrast
        env:
          MAX_CHUNKS: ${{ inputs.max-chunks }}
          CURRENT_CHUNK: ${{ matrix.chunk }}
          THEME: meridian
          SWATCH: ${{ matrix.swatch }}

      - name: Done
        run: echo "Done!"
