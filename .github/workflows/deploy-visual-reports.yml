name: Deploy visual reports

# Report workflows update the gh-pages branch, sometimes several times in
# quick succession. Deploy the latest complete branch snapshot. GitHub retains
# one pending run per concurrency group and replaces that pending run when a
# newer one arrives.
#
# cancel-in-progress must stay true: with it false, a prior run that doesn't
# finish cleanly can leave a stale/stuck deployment on the Pages backend, and
# the next run's deployment then conflicts with it and fails outright
# ("Error: Creating Pages deployment failed... Deployment request failed for
# <id> due to in progress deployment. Please cancel <id> first or wait for it
# to complete."). See https://github.com/actions/deploy-pages/issues/418.
on:
  workflow_run:
    workflows:
      - CI
      - Cleanup visual regression report
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published reports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # visual-regression leaves the PR comment saying "Deploying..." because
      # the report only becomes reachable once Pages has published it.
      - name: Replace "Deploying" with the report link in the PR comment
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${process.env.HEAD_BRANCH}`,
            });
            const pr = prs.find(p => p.head.ref === process.env.HEAD_BRANCH);
            if (!pr) return;

            const marker = '<!-- visual-regression-report -->';
            const deploying = '⏳ Deploying the diff report...';
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (!existing || !existing.body.includes(deploying)) return;

            const url = `${process.env.PAGE_URL}reports/pr-${pr.number}/report.html`;
            const body = existing.body.replace(deploying, `📊 [Open the diff report](${url})`);
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
