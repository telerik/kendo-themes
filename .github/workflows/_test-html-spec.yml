name: Test HTML spec

on:
  workflow_call:

concurrency:
  group: test-html-spec-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup node
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Use cache for root node_modules
        id: cache-root-node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: root-node_modules-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.cache-root-node_modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund

      - name: Use cache for Nx
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-cache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ github.ref }}-
            nx-cache-refs/heads/develop-
            nx-cache-

      - name: Build and check types
        run: |
          npx nx run @progress/kendo-themes-html:build
          npm run typecheck -w packages/html

      - name: Run tests
        run: |
          npx nx run @progress/kendo-themes-html:test
