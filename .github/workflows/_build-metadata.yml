name: Build metadata

on:
  workflow_call:

concurrency:
  group: build-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Use cache for root node_modules
        id: cache-root-node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: root-node_modules-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.cache-root-node_modules.outputs.cache-hit != 'true'
        run: |
          npm ci --no-audit --no-fund

      - name: Download HTML dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: html-dist
          path: .tmp

      - name: Unpack HTML dist
        run: tar -xf .tmp/html-dist.tar

      - name: Build theme metadata and docs
        run: |
          for p in packages/*/; do mkdir -p "$p/dist/meta"; done
          npx nx run-many -t docs --exclude=@progress/kendo-themes-html

      - name: Build HTML a11y docs
        run: |
          node ./scripts/render-a11y-docs.mjs
        working-directory: packages/html

      - name: Check docs are up to date
        run: |
          git diff --name-only --exit-code -- 'packages/*/docs'

      - name: Pack metadata
        run: |
          find packages -maxdepth 3 \( -path "*/dist/meta" -o -path "*/dist/all.scss" \) -print0 | xargs -0 tar -cf metadata.tar

      - name: Upload metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata
          path: metadata.tar
