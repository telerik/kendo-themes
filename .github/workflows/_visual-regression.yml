name: Visual regression
on:
  workflow_call:
    inputs:
      baseline:
        description: >
          True for the develop-branch baseline publish (ci_develop.yml).
          Keeps the per-commit report key so fetch() can look up an exact
          baseline commit. False (default) for PR/feature-branch runs, which
          publish under reports/pr-<number>/ instead, see "Resolve report
          key" below.
        type: boolean
        default: false
    outputs:
      report-url:
        value: ${{ jobs.run.outputs.report-url }}
      changed:
        value: ${{ jobs.run.outputs.changed }}
      new:
        value: ${{ jobs.run.outputs.new }}

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push baseline + report to gh-pages
      pull-requests: write   # post the PR comment
    outputs:
      report-url: ${{ steps.summary.outputs.report-url }}
      changed:    ${{ steps.summary.outputs.changed }}
      new:        ${{ steps.summary.outputs.new }}
    steps:
      - uses: actions/checkout@v6
        with:
          # reg-keygen-git-hash-plugin needs full commit history, but only the
          # commit graph - not file contents. A blobless partial clone gets the
          # same history for a fraction of the transfer on a repo with this many
          # historical image-heavy commits.
          fetch-depth: 0
          filter: blob:none

      - id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Use cache for root node_modules
        id: cache-root-node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: root-node_modules-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.cache-root-node_modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Download screenshot artifacts
        uses: actions/download-artifact@v8
        with:
          path: .tmp

      - name: Unpack artifacts
        run: find .tmp -name "*.tar" -type f -exec tar -xf {} \;

      - name: Configure git identity
        run: |
          git config user.name "kendo-bot"
          git config user.email "kendouiteam@progress.com"

      # Baseline (develop) runs keep the per-commit report key. PR/feature
      # branch runs republish over reports/pr-<number>/ instead, so pushing
      # again to the same PR doesn't leave one report folder per commit
      # behind - see reg-fetch-gh-pages-plugin. Also drives which PR (if any)
      # gets the result comment below, since this workflow is push-triggered
      # and has no pull_request context of its own.
      - name: Resolve report key
        id: resolve-report-key
        if: ${{ !inputs.baseline }}
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const openPr = prs.find(pr => pr.state === 'open');
            if (openPr) {
              core.exportVariable('REG_REPORT_KEY', `pr-${openPr.number}`);
              core.setOutput('pr-number', String(openPr.number));
              core.info(`Publishing under reports/pr-${openPr.number}/ (PR #${openPr.number})`);
            } else {
              core.info('No open PR found for this commit; falling back to per-commit report key.');
            }

      - name: Run reg-suit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # visual change is NOT a hard failure; review is human.
        # Output is captured because each run publishes under its own report
        # key (reports/<key>/, see "Resolve report key" above) - the
        # "Summarize result" step below parses the real "Report URL: ..."
        # line reg-suit prints instead of hardcoding one.
        run: npx reg-suit run 2>&1 | tee reg-suit-output.log || true

      - name: Read publish target
        id: publish-target
        run: |
          if [ -f reg-publish-info.json ]; then
            node -e "const i=require('./reg-publish-info.json'); console.log('source-dir='+i.sourceDir); console.log('target-dir='+i.targetDir);" >> "$GITHUB_OUTPUT"
          fi

      # A full report publishes actual+expected images for every compared
      # item, passed or not (~9,900 files / ~400MB for this repo, ~99% of it
      # for items that are pixel-identical). None of that is needed:
      #  - reg-fetch-gh-pages-plugin's fetch() only ever reads back a
      #    baseline (develop) report's "actual/" dir as the next run's
      #    comparison baseline - it never reads "expected/" from anywhere,
      #    and never reads a PR report (reports/pr-<number>/) back at all.
      #  - the published report.js viewer (reg-cli) renders plain <img> tags
      #    with no fetch()/XHR existence check and an onerror handler, so a
      #    missing image for a passed item just degrades to a broken
      #    thumbnail if someone expands it, not a broken report.
      # So it's safe to drop what nothing needs: "expected/" entirely on
      # baseline reports, and both "actual/"+"expected/" for passed items on
      # PR reports (keeping full images only for what's actually worth a
      # human looking at: failed/new/deleted items). This is what keeps
      # report size bounded well under GitHub Pages' 1GB limit even with
      # several PRs' reports coexisting on gh-pages at once.
      - name: Prune unneeded images before publish
        if: steps.publish-target.outputs.target-dir != ''
        env:
          SOURCE_DIR: ${{ steps.publish-target.outputs.source-dir }}
          IS_BASELINE: ${{ inputs.baseline }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const sourceDir = process.env.SOURCE_DIR;
            const isBaseline = process.env.IS_BASELINE === "true";
            const out = JSON.parse(fs.readFileSync(path.join(sourceDir, "out.json"), "utf8"));

            if (isBaseline) {
              fs.rmSync(path.join(sourceDir, out.expectedDir), { recursive: true, force: true });
              console.log("Baseline report: dropped " + out.expectedDir + "/ entirely (never read back).");
            } else {
              for (const item of out.passedItems) {
                fs.rmSync(path.join(sourceDir, out.actualDir, item), { force: true });
                fs.rmSync(path.join(sourceDir, out.expectedDir, item), { force: true });
              }
              console.log(`PR report: dropped actual+expected for ${out.passedItems.length} passed item(s).`);
            }
          '

      # reg-suit's own publish plugin shells out to `git commit`/`git push`
      # against a worktree of the *entire* gh-pages history, which reliably
      # crashes with ENOBUFS once a run has a real (non-"new") diff to report
      # - see PR #5997 discussion. Publishing is done here instead. With
      # destination_dir set, keep_files:false only clears *that* subfolder
      # before copying (see peaceiris/actions-gh-pages' setRepo()) - other
      # report folders on gh-pages are untouched, and for PR runs it wipes
      # any file that dropped out of the report since the last push instead
      # of leaving it behind under reports/pr-<number>/.
      - name: Publish report to gh-pages
        if: steps.publish-target.outputs.target-dir != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.publish-target.outputs.source-dir }}
          destination_dir: ${{ steps.publish-target.outputs.target-dir }}
          keep_files: false
          user_name: kendo-bot
          user_email: kendouiteam@progress.com

      # Baseline runs publish under reports/<commit-sha>/ (see "Resolve report
      # key" above - REG_REPORT_KEY is only set for PR runs), and fetch() only
      # ever needs the single latest one: reg-keygen-git-hash-plugin resolves
      # the expected key to the merge-base against develop, which for an
      # up-to-date PR branch is the most recent baseline commit. Without this,
      # every merge to develop would leave its baseline behind forever,
      # reintroducing the unbounded growth this PR replaces (~200MB/merge).
      # A stale/un-rebased PR branch whose baseline got pruned just falls back
      # to "treat as new" (see reg-fetch-gh-pages-plugin's fetch()) rather than
      # failing.
      - name: Prune old baseline reports
        if: ${{ inputs.baseline && steps.publish-target.outputs.target-dir != '' }}
        run: |
          git fetch --depth 1 origin gh-pages
          git worktree add gh-pages-prune origin/gh-pages

          KEEP="$(basename "${{ steps.publish-target.outputs.target-dir }}")"
          cd gh-pages-prune

          for dir in reports/*/; do
            name="$(basename "$dir")"
            [[ "$name" == pr-* || "$name" == "$KEEP" ]] && continue
            git rm -rq --ignore-unmatch "$dir"
          done

          if ! git diff --cached --quiet; then
            git config user.name "kendo-bot"
            git config user.email "kendouiteam@progress.com"
            git commit -q -m "chore(ci): prune stale visual regression baselines, keep $KEEP"
            # HEAD is detached (git worktree add checked out origin/gh-pages
            # directly, no local gh-pages branch) - push it explicitly as one.
            git push origin HEAD:gh-pages
          fi

      - name: Summarize result
        id: summary
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const out = JSON.parse(fs.readFileSync('.reg/out.json', 'utf8'));
            const changed = out.failedItems.length;
            const added   = out.newItems.length;
            const deleted = out.deletedItems.length;
            const passed  = out.passedItems.length;

            // Each run publishes under its own report key (reports/<key>/,
            // see "Resolve report key" above) - read the real URL reg-suit
            // printed instead of hardcoding one.
            const log = fs.existsSync('reg-suit-output.log') ? fs.readFileSync('reg-suit-output.log', 'utf8') : '';
            const match = [...log.matchAll(/Report URL:\s*(\S+)/g)].pop();
            const reportUrl = match ? match[1] : `https://${context.repo.owner}.github.io/${context.repo.repo}/reports/`;
            core.setOutput('report-url', reportUrl);
            core.setOutput('changed', String(changed));
            core.setOutput('new', String(added));

            // This workflow is push-triggered, so there's no pull_request
            // context (context.issue.number is always unset here) - use the
            // PR resolved in "Resolve report key" instead.
            const issue_number = Number('${{ steps.resolve-report-key.outputs.pr-number }}') || undefined;
            if (!issue_number) return;   // no open PR for this commit (or a baseline run)
            const marker = '<!-- reg-suit-visual-report -->';
            const body = [
              marker,
              '### 🖼️ Visual regression',
              `| Changed | New | Deleted | Passed |`,
              `|--:|--:|--:|--:|`,
              `| **${changed}** | ${added} | ${deleted} | ${passed} |`,
              '',
              `📊 [Open the diff report](${reportUrl})`,
              changed === 0 && added === 0
                ? '_No visual changes detected._'
                : '_Review the report, then approve by merging — the baseline updates on `develop`._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
