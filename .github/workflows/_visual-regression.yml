name: Visual regression

# Compares this run's screenshots against the last develop baseline using
# reg-cli directly (no reg-suit, no gh-pages). The baseline is just an
# actions/cache entry - GitHub's built-in cache eviction (7 days unused, or
# oldest-first past the repo's 10GB quota) keeps it bounded automatically, no
# custom pruning workflow needed. The report is uploaded as a build artifact
# instead of a hosted site: reg-cli's report.html only ever uses plain <img>
# tags with relative paths (no fetch()/XHR), so it renders correctly straight
# out of a downloaded/unzipped artifact with no server required. This trades
# a one-click hosted diff viewer for zero hosting/lifecycle machinery - see
# the "Visual regression: reg-suit vs artifact-based" discussion for the
# full rationale.

on:
  workflow_call:
    inputs:
      baseline:
        description: True for the develop-branch baseline run (ci_develop.yml), which saves this run's screenshots as the new baseline cache instead of comparing against one.
        type: boolean
        default: false
    outputs:
      changed:
        value: ${{ jobs.run.outputs.changed }}
      new:
        value: ${{ jobs.run.outputs.new }}

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # post the PR comment
    outputs:
      changed: ${{ steps.summary.outputs.changed }}
      new:     ${{ steps.summary.outputs.new }}
    steps:
      - uses: actions/checkout@v7

      - id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Use cache for root node_modules
        id: cache-root-node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: root-node_modules-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.cache-root-node_modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Download screenshot artifacts
        uses: actions/download-artifact@v8
        with:
          path: .tmp

      - name: Unpack artifacts
        run: find .tmp -name "*.tar" -type f -exec tar -xf {} \;

      # The develop baseline is just a cache entry, keyed by commit so it's
      # never ambiguous which one is "latest" - restore-keys (prefix match,
      # newest first) finds it without needing to know the exact SHA. A cache
      # miss (first run ever, or one older than 7 days with nothing since to
      # refresh it) just means "nothing to compare against yet" - reg-cli
      # below reports every screenshot as new rather than failing.
      - name: Restore baseline screenshots
        if: ${{ !inputs.baseline }}
        uses: actions/cache/restore@v4
        with:
          path: baseline-images
          key: visual-baseline-${{ github.sha }}
          restore-keys: |
            visual-baseline-

      - name: Compare against baseline
        if: ${{ !inputs.baseline }}
        run: |
          mkdir -p baseline-images
          # Thresholds match the previous regconfig.json (reg-suit) settings.
          npx reg-cli tests/_output baseline-images .reg/diff \
            --report .reg/report.html --json .reg/out.json \
            --matchingThreshold 0.05 --thresholdRate 0.001 --enableAntialias \
            --additionalDetection client || true

          if [ ! -f .reg/out.json ]; then
            echo "::error::.reg/out.json was not written by reg-cli; failing loudly instead of reporting stale/empty results."
            exit 1
          fi

      # include-hidden-files is required: .reg is a dot-directory, and
      # actions/upload-artifact excludes hidden files/directories by default
      # - without this it silently uploads an empty artifact (just a
      # warning, not a failure) instead of the actual report, confirmed in
      # production.
      - name: Upload visual report
        if: ${{ !inputs.baseline }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: .reg
          retention-days: 30
          include-hidden-files: true

      - name: Stage new baseline
        if: inputs.baseline
        run: cp -r tests/_output baseline-images

      # Every merge to develop replaces the baseline wholesale (one cache
      # entry per commit; old ones age out via GitHub's own eviction, see
      # above) rather than mutating it in place, so a run reading it never
      # races a run writing it.
      - name: Save new baseline
        if: inputs.baseline
        uses: actions/cache/save@v4
        with:
          path: baseline-images
          key: visual-baseline-${{ github.sha }}

      - name: Summarize result
        id: summary
        if: ${{ !inputs.baseline }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const out = JSON.parse(fs.readFileSync('.reg/out.json', 'utf8'));
            const changed = out.failedItems.length;
            const added   = out.newItems.length;
            const deleted = out.deletedItems.length;
            const passed  = out.passedItems.length;
            core.setOutput('changed', String(changed));
            core.setOutput('new', String(added));

            // This job is push-triggered (see _visual-regression.yml's
            // callers), so there's no pull_request context - find whichever
            // open PR currently points at this branch, if any.
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
            const pr = prs.find(p => p.head.ref === branch && p.head.repo?.full_name === `${owner}/${repo}`);
            if (!pr) return;   // no open PR for this branch right now

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const marker = '<!-- visual-regression-report -->';
            const body = [
              marker,
              '### 🖼️ Visual regression',
              '| Changed | New | Deleted | Passed |',
              '|--:|--:|--:|--:|',
              `| **${changed}** | ${added} | ${deleted} | ${passed} |`,
              '',
              `📦 [Download the report](${runUrl}) from this run's artifacts (\`visual-regression-report\`), unzip, and open \`report.html\`.`,
              changed === 0 && added === 0
                ? '_No visual changes detected._'
                : '_Review the report, then approve by merging — the baseline updates on `develop`._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
