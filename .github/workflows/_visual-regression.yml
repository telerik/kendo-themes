name: Visual regression

# Report only - this job never commits. tests/_output is git-tracked and is
# committed as-is by _commit-previews.yml, so git is the source of truth. Here
# reg-cli just compares the freshly captured screenshots with develop's
# committed tests/_output (at the merge-base) and publishes a browsable diff
# report to gh-pages.

on:
  workflow_call:
    outputs:
      report-url:
        value: ${{ jobs.run.outputs.report-url }}
      changed:
        value: ${{ jobs.run.outputs.changed }}
      new:
        value: ${{ jobs.run.outputs.new }}

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the report to gh-pages
      pull-requests: write   # post the PR comment
    outputs:
      report-url: ${{ steps.summary.outputs.report-url }}
      changed:    ${{ steps.summary.outputs.changed }}
      new:        ${{ steps.summary.outputs.new }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Use cache for root node_modules
        id: cache-root-node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: root-node_modules-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.cache-root-node_modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: .tmp

      # The checkout already holds the previously committed tests/_output;
      # replace it with this run's screenshots so only they are compared.
      - name: Unpack screenshots
        run: |
          rm -rf tests/_output
          find .tmp -name "*.tar" -type f -exec tar -xf {} \;

      # reg-cli embeds actualDir/expectedDir as paths relative to the report
      # file itself, so a gh-pages-published report that points outside its
      # own folder (e.g. "../tests/_output") can't resolve - every PR's
      # report lives under its own reports/pr-<n>/ folder with nothing above
      # it. Staging siblings of report.html keeps every reference local to
      # that one self-contained folder, so it still publishes correctly.
      # develop's committed tests/_output at the merge-base is the baseline,
      # so the report shows exactly what this PR changes. Until develop
      # carries a tests/_output, there is nothing to compare against and
      # every screenshot comes back as a "new item".
      - name: Diff against develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .reg/actual .reg/expected .reg/base
          cp -r tests/_output/. .reg/actual/

          BASE=$(gh api "repos/${{ github.repository }}/compare/develop...${{ github.sha }}" --jq .merge_base_commit.sha)
          echo "Baseline: tests/_output at merge-base $BASE"
          git fetch --depth=1 origin "$BASE"
          if git archive "$BASE" tests/_output 2>/dev/null | tar -x -C .reg/base; then
            cp -r .reg/base/tests/_output/. .reg/expected/
          else
            echo "No tests/_output at the merge-base; treating the baseline as empty."
          fi
          rm -rf .reg/base

          # Matches the old reg-suit regconfig.json tolerance: headless
          # Chromium's font/anti-aliasing rendering is non-deterministic at
          # the sub-pixel level, so an exact-match threshold (reg-cli's
          # default) would flag invisible 1-LSB noise as a "change".
          npx reg-cli .reg/actual .reg/expected .reg/diff --matchingThreshold 0.05 --enableAntialias --report .reg/report.html --json .reg/out.json || true

      # Resolve by branch, not exact SHA: this job's own push below does not
      # trigger its own CI run, so the triggering commit can already be
      # stale. If no open PR exists yet (e.g. this is the first push on a
      # brand-new branch, before `gh pr create`), the report/comment below
      # are skipped for this run - the next push (once the PR exists) catches
      # up.
      - name: Resolve pull request
        id: resolve-pr
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });
            const openPr = prs.find(pr => pr.head.ref === branch);
            if (openPr) {
              core.setOutput('pr-number', String(openPr.number));
            } else {
              core.info('No open PR found for this branch yet; skipping report publish and PR comment.');
            }

      # The report only needs actual+expected images for items worth a human
      # looking at - passed items add nothing but publish size.
      - name: Prune passed items before publish
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const out = JSON.parse(fs.readFileSync(".reg/out.json", "utf8"));
            for (const item of out.passedItems) {
              fs.rmSync(path.join(".reg/actual", item), { force: true });
              fs.rmSync(path.join(".reg/expected", item), { force: true });
            }
            console.log(`Dropped actual+expected for ${out.passedItems.length} passed item(s).`);
          '

      - name: Publish report to gh-pages
        if: steps.resolve-pr.outputs.pr-number != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: .reg
          destination_dir: reports/pr-${{ steps.resolve-pr.outputs.pr-number }}
          keep_files: false
          user_name: kendo-bot
          user_email: kendouiteam@progress.com

      - name: Update reports index
        if: steps.resolve-pr.outputs.pr-number != ''
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            let dirs = [];
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: 'reports', ref: 'gh-pages' });
              dirs = data.filter(e => e.type === 'dir').map(e => e.name);
            } catch (error) {
              core.warning(`Unable to list reports/ on gh-pages: ${error.message}`);
              return;
            }

            const prDirs = dirs.filter(d => d.startsWith('pr-')).sort((a, b) => Number(b.slice(3)) - Number(a.slice(3)));
            const rows = prDirs
              .map(d => {
                const n = d.slice(3);
                return `<li><a href="reports/${d}/report.html">PR #${n} report</a> - <a href="https://github.com/${owner}/${repo}/pull/${n}">view PR</a></li>`;
              })
              .join('\n');
            const home = [
              '<!DOCTYPE html>',
              '<meta charset="utf-8">',
              `<title>${repo} visual regression reports</title>`,
              `<h1>${repo} visual regression reports</h1>`,
              '<ul>',
              rows || '<li><em>No open PR reports.</em></li>',
              '</ul>',
              '',
            ].join('\n');

            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                let sha;
                try {
                  const { data: current } = await github.rest.repos.getContent({ owner, repo, path: 'index.html', ref: 'gh-pages' });
                  sha = current.sha;
                } catch {
                  // index.html doesn't exist yet
                }
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path: 'index.html',
                  message: 'chore(ci): update reports index',
                  content: Buffer.from(home).toString('base64'),
                  branch: 'gh-pages',
                  committer: { name: 'kendo-bot', email: 'kendouiteam@progress.com' },
                  author: { name: 'kendo-bot', email: 'kendouiteam@progress.com' },
                  ...(sha ? { sha } : {}),
                });
                break;
              } catch (error) {
                if (attempt === 3 || ![409, 422].includes(error.status)) throw error;
                core.info(`Reports index changed concurrently; retrying (${attempt}/3).`);
              }
            }

      - name: Summarize result
        id: summary
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const out = JSON.parse(fs.readFileSync('.reg/out.json', 'utf8'));
            const changed = out.failedItems.length;
            const added   = out.newItems.length;
            const deleted = out.deletedItems.length;
            const passed  = out.passedItems.length;

            const prNumber = '${{ steps.resolve-pr.outputs.pr-number }}';
            const reportUrl = prNumber
              ? `https://${context.repo.owner}.github.io/${context.repo.repo}/reports/pr-${prNumber}/report.html`
              : '';
            core.setOutput('report-url', reportUrl);
            core.setOutput('changed', String(changed));
            core.setOutput('new', String(added));

            if (!prNumber) return;

            const issue_number = Number(prNumber);
            const marker = '<!-- visual-regression-report -->';
            const DEPLOYING_LINE = '⏳ Deploying the diff report...';
            const body = [
              marker,
              '## Visual Regression',
              '',
              '| Changed | New | Deleted | Passed |',
              '|--:|--:|--:|--:|',
              `| **${changed}** | ${added} | ${deleted} | ${passed} |`,
              '',
              // deploy-visual-reports.yml swaps this line for the report link
              // once the Pages deployment is live.
              DEPLOYING_LINE,
            ].join('\n');

            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
