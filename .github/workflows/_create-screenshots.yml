name: Create screenshots

on:
  workflow_call:

concurrency:
  group: create-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run:
    runs-on: ubuntu-latest
    # Each matrix job used to run its own `playwright install --with-deps`
    # (browser download + apt-get system deps), so every run did up to 6
    # redundant, fully concurrent network installs - besides the waste, this
    # made runs prone to stalling whenever the CDN/apt mirror hiccuped under
    # that concurrency. The official Playwright image ships Chromium and all
    # its system deps pre-baked, so no per-job installs/network calls happen
    # at all. Keep this tag in sync with the `playwright` version in
    # package.json - a mismatch fails fast with a clear version-mismatch
    # error from Playwright itself.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    strategy:
      matrix:
        theme: [default, bootstrap, material, classic, fluent, meridian]

    steps:

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Checkout provides packages/html/shared/index.html and packages/html/assets/
        # which the capture server needs but are not in the html-dist artifact.

      - name: Setup node
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Use cache for root node_modules
        id: cache-root-node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: root-node_modules-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.cache-root-node_modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .tmp

      - name: Unpack artifacts
        # Restores packages/html/dist (html-dist.tar) and packages/*/dist/all.css (theme tars)
        run: find .tmp -name "*.tar" -type f -exec tar -xf {} \;

      - name: Create screenshots
        run: node scripts/capture.mjs --themes ${{ matrix.theme }} --components '*'

      - name: Pack screenshots
        run: tar -cf screenshots-${{ matrix.theme }}.tar tests/_output/${{ matrix.theme }}

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.theme }}
          path: screenshots-${{ matrix.theme }}.tar

