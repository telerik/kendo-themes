name: CI

on:
  push:
    branches-ignore:
      - 'master'
      - 'develop'
      - 'v4-dev'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  compile-themes:
    name: Compile themes
    uses: ./.github/workflows/_compile-themes.yml

  test-html-spec:
    name: Test HTML spec
    uses: ./.github/workflows/_test-html-spec.yml

  ci-test-html-spec:
    name: Status check > HTML spec
    runs-on: ubuntu-latest
    needs: [ test-html-spec ]
    steps:
      - name: Done
        run: echo "Done!"

  render-test-pages:
    name: Render test pages
    permissions:
      contents: write   # commit regenerated markup snapshots back to the branch
    uses: ./.github/workflows/_render-test-pages.yml
    with:
      force-render: NO
      upload-policy: conditionally

  build-html:
    name: Build HTML devkit
    uses: ./.github/workflows/_build-html.yml

  create-screenshots:
    name: Create screenshots
    uses: ./.github/workflows/_create-screenshots.yml
    needs: [ compile-themes, build-html ]

  # Runs immediately (no needs) so the PR sees this the moment CI starts,
  # rather than only once create-screenshots' several-minute matrix finishes
  # - matches Package Report's post-status-comment job, which does the same
  # thing for its own PR comment.
  visual-regression-placeholder:
    name: Visual regression (placeholder)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      pr-number: ${{ steps.placeholder.outputs.pr-number }}
    steps:
      - name: Resolve pull request and post placeholder comment
        id: placeholder
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
            const pr = prs.find(p => p.head.ref === branch && p.head.repo?.full_name === `${owner}/${repo}`);
            if (!pr) return;   // no open PR for this branch right now
            core.setOutput('pr-number', String(pr.number));

            const marker = '<!-- visual-regression-report -->';
            const body = [marker, '### 🖼️ Visual regression', '', 'Generating... ⚠️'].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

  visual-regression:
    name: Visual regression
    needs: [ create-screenshots, visual-regression-placeholder ]
    permissions:
      pull-requests: write
    uses: ./.github/workflows/_visual-regression.yml
    with:
      pr-number: ${{ needs.visual-regression-placeholder.outputs.pr-number }}


  set-commit-status:
    name: Set commit status
    runs-on: ubuntu-latest
    needs: [ visual-regression, ci-lint-scripts, ci-lint-styles, ci-audit-css, ci-docs, ci-test-units, ci-test-integrations, ci-a11y, ci-test-html-spec, ci-a11y-specs ]
    timeout-minutes: 30
    if: ${{ always() }}

    permissions:
      statuses: write

    steps:
      - name: Set visual snapshot commit status
        uses: actions/github-script@v9
        with:
          script: |
            const results = [
              ['${{ needs.ci-test-units.result }}', 'Status check > Unit'],
              ['${{ needs.ci-test-integrations.result }}', 'Status check > Integration'],
              ['${{ needs.ci-lint-scripts.result }}', 'Status check > Lint scripts'],
              ['${{ needs.ci-lint-styles.result }}', 'Status check > Lint styles'],
              ['${{ needs.ci-audit-css.result }}', 'Status check > CSS Audit'],
              ['${{ needs.ci-a11y.result }}', 'Status check > A11y'],
              ['${{ needs.ci-a11y-specs.result }}', 'Status check > A11y Specs'],
              ['${{ needs.ci-docs.result }}', 'Status check > Docs'],
              ['${{ needs.ci-test-html-spec.result }}', 'Status check > HTML spec'],
              ['${{ needs.visual-regression.result }}', 'Status check > Visual']
            ];

            const mapState = (r) => r === 'success' ? 'success' : 'failure';

            const sha = context.sha;
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            await Promise.all(results.map(([result, contextName]) =>
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                context: contextName,
                state: mapState(result),
                target_url: targetUrl,
                description: 'CI status check'
              })
            ));

  ci-visual:
    name: Status check > Visual
    runs-on: ubuntu-latest
    needs: [ visual-regression ]
    steps:
      - name: Done
        run: echo "Done!"


  lint-scripts:
    name: Lint scripts
    uses: ./.github/workflows/_lint-scripts.yml

  ci-lint-scripts:
    name: Status check > Lint scripts
    runs-on: ubuntu-latest
    needs: [ lint-scripts ]
    steps:
      - name: Done
        run: echo "Done!"


  lint-styles:
    name: Lint styles
    uses: ./.github/workflows/_lint-styles.yml

  ci-lint-styles:
    name: Status check > Lint styles
    runs-on: ubuntu-latest
    needs: [ lint-styles ]
    steps:
      - name: Done
        run: echo "Done!"

  audit-css:
    name: Audit CSS
    needs: [ compile-themes ]
    uses: ./.github/workflows/_audit-css.yml

  ci-audit-css:
    name: Status check > CSS Audit
    runs-on: ubuntu-latest
    needs: [ audit-css ]
    steps:
      - name: Done
        run: echo "Done!"

  a11y:
    name: A11y
    needs: [ compile-themes, render-test-pages ]
    uses: ./.github/workflows/_test-contrast.yml
    with:
      max-chunks: 4

  ci-a11y:
    name: Status check > A11y
    runs-on: ubuntu-latest
    needs: [ a11y ]
    steps:
      - name: Done
        run: echo "Done!"

  a11y-specs:
    name: A11y Specs
    needs: [ compile-themes ]
    uses: ./.github/workflows/_test-a11y-specs.yml

  ci-a11y-specs:
    name: Status check > A11y Specs
    runs-on: ubuntu-latest
    needs: [ a11y-specs ]
    steps:
      - name: Done
        run: echo "Done!"


  docs:
    name: Docs
    needs: [ compile-themes ]
    uses: ./.github/workflows/_docs-check.yml

  ci-docs:
    name: Status check > Docs
    runs-on: ubuntu-latest
    needs: [ docs ]
    steps:
      - name: Done
        run: echo "Done!"


  test-units:
    name: Test units
    uses: ./.github/workflows/_test-units.yml

  ci-test-units:
    name: Status check > Unit
    runs-on: ubuntu-latest
    needs: [ test-units ]
    steps:
      - name: Done
        run: echo "Done!"


  test-integrations:
    name: Test integrations
    uses: ./.github/workflows/_test-integrations.yml

  ci-test-integrations:
    name: Status check > Integration
    runs-on: ubuntu-latest
    needs: [ test-integrations ]
    steps:
      - name: Done
        run: echo "Done!"
