name: CI

on:
  push:
    branches-ignore:
      - 'master'
      - 'develop'
      - 'v4-dev'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  visual-regression-pending:
    name: Visual regression pending
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Flip the PR comment to "Generating..." as soon as CI starts; the
      # visual-regression job overwrites it with the final summary.
      - name: Mark PR comment as generating
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
            const pr = prs.find(p => p.head.ref === branch);
            if (!pr) {
              core.info('No open PR for this branch yet; nothing to mark.');
              return;
            }
            const issue_number = pr.number;
            const marker = '<!-- visual-regression-report -->';
            const body = [marker, '## Visual Regression', '', 'Generating... ⚠️', ''].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  compile-themes:
    name: Compile themes
    uses: ./.github/workflows/_compile-themes.yml

  test-html-spec:
    name: Test HTML spec
    uses: ./.github/workflows/_test-html-spec.yml

  ci-test-html-spec:
    name: Status check > HTML spec
    runs-on: ubuntu-latest
    needs: [ test-html-spec ]
    steps:
      - name: Done
        run: echo "Done!"

  render-test-pages:
    name: Render test pages
    uses: ./.github/workflows/_render-test-pages.yml
    with:
      force-render: NO
      upload-policy: conditionally

  build-html:
    name: Build HTML devkit
    uses: ./.github/workflows/_build-html.yml

  create-screenshots:
    name: Create screenshots
    uses: ./.github/workflows/_create-screenshots.yml
    needs: [ compile-themes, build-html ]


  # Same as before reg-suit: tests/ (markup + screenshots) is committed as-is
  # and git is the source of truth. No image comparison happens here.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    needs: [ render-test-pages, create-screenshots ]

    permissions:
      contents: write

    outputs:
      snapshot_sha: ${{ steps.snapshot_sha.outputs.sha }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: .tmp

      # Screenshots are re-captured in full, so drop the committed ones first;
      # variants that no longer exist then show up as deletions.
      - name: Unpack artifacts
        run: |
          rm -rf tests/_output
          find .tmp -name "*.tar" -type f -exec tar -xf {} \;

      - name: Compare artifacts
        run: |
          HAS_CHANGES=0
          HAS_NEW=0
          git diff --exit-code --quiet -- tests/ || HAS_CHANGES=1
          [[ $(git ls-files --others --exclude-standard tests/) ]] && HAS_NEW=1
          echo "HAS_CHANGES=$HAS_CHANGES" >> $GITHUB_ENV
          echo "HAS_NEW=$HAS_NEW" >> $GITHUB_ENV

      - name: Setup git user
        run: |
          git config user.name "kendo-bot"
          git config user.email "kendouiteam@progress.com"

      - name: Push changes to GitHub
        if: ${{ (env.HAS_CHANGES == 1 || env.HAS_NEW == 1) }}
        run: |
          echo "Visual tests have detected changes. Updating markup and screenshots."

          git add tests/
          git commit -m "chore: update visual previews"

          for attempt in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && break
            [ "$attempt" -eq 3 ] && exit 1
            git pull --rebase origin ${{ github.ref_name }}
          done

      - name: Get snapshot commit SHA
        id: snapshot_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT


  # Report only: compares this run's screenshots with develop's and publishes
  # the diff report to gh-pages. It never commits.
  visual-regression:
    name: Visual regression
    needs: [ create-screenshots ]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_visual-regression.yml


  set-commit-status:
    name: Set commit status
    runs-on: ubuntu-latest
    needs: [ detect-changes, visual-regression, ci-lint-scripts, ci-lint-styles, ci-audit-css, ci-docs, ci-test-units, ci-test-integrations, ci-a11y, ci-test-html-spec, ci-a11y-specs, render-test-pages ]
    timeout-minutes: 30
    if: ${{ always() }}

    permissions:
      statuses: write

    steps:
      - name: Set visual snapshot commit status
        uses: actions/github-script@v9
        with:
          script: |
            const results = [
              ['${{ needs.ci-test-units.result }}', 'Status check > Unit'],
              ['${{ needs.ci-test-integrations.result }}', 'Status check > Integration'],
              ['${{ needs.ci-lint-scripts.result }}', 'Status check > Lint scripts'],
              ['${{ needs.ci-lint-styles.result }}', 'Status check > Lint styles'],
              ['${{ needs.ci-audit-css.result }}', 'Status check > CSS Audit'],
              ['${{ needs.ci-a11y.result }}', 'Status check > A11y'],
              ['${{ needs.ci-a11y-specs.result }}', 'Status check > A11y Specs'],
              ['${{ needs.ci-docs.result }}', 'Status check > Docs'],
              ['${{ needs.ci-test-html-spec.result }}', 'Status check > HTML spec'],
              ['${{ needs.visual-regression.result }}', 'Status check > Visual']
            ];

            const mapState = (r) => r === 'success' ? 'success' : 'failure';

            // detect-changes may push a bot commit that becomes the PR's
            // HEAD without triggering its own CI run, so report against its
            // final sha rather than the (possibly stale) triggering commit.
            const sha = '${{ needs.detect-changes.outputs.snapshot_sha }}';
            const targetUrl = '${{ needs.visual-regression.outputs.report-url }}' || `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            console.log(`Setting statuses for commit ${sha}`);
            console.log(`Target URL: ${targetUrl}`);

            for (const [result, contextName] of results) {
              try {
                const state = mapState(result);
                console.log(`Setting status: ${contextName} = ${state}`);
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  context: contextName,
                  state,
                  target_url: targetUrl,
                  description: 'CI status check'
                });
                console.log(`✓ ${contextName} set to ${state}`);
              } catch (error) {
                console.error(`✗ Failed to set ${contextName}: ${error.message}`);
                throw error;
              }
            }

  ci-visual:
    name: Status check > Visual
    runs-on: ubuntu-latest
    needs: [ visual-regression ]
    steps:
      - name: Done
        run: echo "Done!"


  lint-scripts:
    name: Lint scripts
    uses: ./.github/workflows/_lint-scripts.yml

  ci-lint-scripts:
    name: Status check > Lint scripts
    runs-on: ubuntu-latest
    needs: [ lint-scripts ]
    steps:
      - name: Done
        run: echo "Done!"


  lint-styles:
    name: Lint styles
    uses: ./.github/workflows/_lint-styles.yml

  ci-lint-styles:
    name: Status check > Lint styles
    runs-on: ubuntu-latest
    needs: [ lint-styles ]
    steps:
      - name: Done
        run: echo "Done!"

  audit-css:
    name: Audit CSS
    needs: [ compile-themes ]
    uses: ./.github/workflows/_audit-css.yml

  ci-audit-css:
    name: Status check > CSS Audit
    runs-on: ubuntu-latest
    needs: [ audit-css ]
    steps:
      - name: Done
        run: echo "Done!"

  a11y:
    name: A11y
    needs: [ compile-themes, render-test-pages ]
    uses: ./.github/workflows/_test-contrast.yml
    with:
      max-chunks: 4

  ci-a11y:
    name: Status check > A11y
    runs-on: ubuntu-latest
    needs: [ a11y ]
    steps:
      - name: Done
        run: echo "Done!"

  a11y-specs:
    name: A11y Specs
    needs: [ compile-themes ]
    uses: ./.github/workflows/_test-a11y-specs.yml

  ci-a11y-specs:
    name: Status check > A11y Specs
    runs-on: ubuntu-latest
    needs: [ a11y-specs ]
    steps:
      - name: Done
        run: echo "Done!"


  docs:
    name: Docs
    needs: [ compile-themes ]
    uses: ./.github/workflows/_docs-check.yml

  ci-docs:
    name: Status check > Docs
    runs-on: ubuntu-latest
    needs: [ docs ]
    steps:
      - name: Done
        run: echo "Done!"


  test-units:
    name: Test units
    uses: ./.github/workflows/_test-units.yml

  ci-test-units:
    name: Status check > Unit
    runs-on: ubuntu-latest
    needs: [ test-units ]
    steps:
      - name: Done
        run: echo "Done!"


  test-integrations:
    name: Test integrations
    uses: ./.github/workflows/_test-integrations.yml

  ci-test-integrations:
    name: Status check > Integration
    runs-on: ubuntu-latest
    needs: [ test-integrations ]
    steps:
      - name: Done
        run: echo "Done!"
