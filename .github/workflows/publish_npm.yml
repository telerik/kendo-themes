name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stable
      dry-run:
        description: "Dry run"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - "CI Weekly"
    branches:
      - develop
    types:
      - completed

env:
  RELEASE_TYPE: ${{ github.event_name == 'workflow_run' && 'dev' || inputs.release-type }}
  DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && '--dry-run' || '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: upload

    permissions:
      id-token: write # Required by npm OIDC trusted publishing
      contents: write # Allows nx release to create tags and GitHub releases
      packages: read

    steps:
      - name: Import Secrets
        id: import-secrets
        uses: LanceMcCarthy/akeyless-action@v5
        with:
          access-id: ${{ secrets.GH_AKEYLESS_ACCESS_ID }}
          static-secrets: '{ "/WebComponents/prod/tokens/GH_TOKEN": "GH_TOKEN" }'
          export-secrets-to-environment: false

      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TYPE == 'stable' && 'master' || 'develop' }}
          fetch-depth: "0"
          token: ${{ steps.import-secrets.outputs.GH_TOKEN }}

      - name: Setup git
        run: |
          git config user.name "kendo-bot"
          git config user.email "kendouiteam@progress.com"

      - name: Merge develop to master
        if: env.RELEASE_TYPE == 'stable'
        run: |
          git fetch --quiet
          git reset --hard origin/master
          git merge --ff-only --quiet origin/develop

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build themes for dist
        run: |
          npm run sass:dist
          npm run docs

      - name: Nx release (stable)
        if: env.RELEASE_TYPE == 'stable'
        run: |
          npm run release:version -- ${{ env.DRY_RUN }}
          if [[ -z "${{ env.DRY_RUN }}" ]]; then
            STABLE_VERSION=$(jq -r '.version' packages/core/package.json)
            npm run release:changelog -- "$STABLE_VERSION"
            npm run release:publish
          fi
        env:
          GITHUB_TOKEN: ${{ steps.import-secrets.outputs.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Nx release (dev)
        if: env.RELEASE_TYPE == 'dev'
        run: |
          npm run release:prerelease -- ${{ env.DRY_RUN }}
          if [[ -z "${{ env.DRY_RUN }}" ]]; then
            DEV_VERSION=$(jq -r '.version' packages/core/package.json)
            npm run release:changelog -- "$DEV_VERSION"
            npm run release:publish -- --tag dev
          fi
        env:
          GITHUB_TOKEN: ${{ steps.import-secrets.outputs.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Mark checks as successful
        if: env.DRY_RUN == ''
        run: |
          commit=$(git rev-parse HEAD)
          ./build/mark-checks.sh $commit
        env:
          GH_TOKEN: ${{ steps.import-secrets.outputs.GH_TOKEN }}

      - name: Push to GitHub
        if: env.DRY_RUN == ''
        run: |
          if [[ "${{ env.RELEASE_TYPE }}" == 'stable' ]]; then
            git push origin master --tags --quiet > /dev/null 2>&1
            git push origin master:develop --quiet > /dev/null 2>&1
          else
            git push origin develop --tags --quiet > /dev/null 2>&1
          fi
