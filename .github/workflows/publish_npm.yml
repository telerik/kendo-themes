name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stable
      version:
        description: "Stable version tag (example: v14.1.1)"
        required: false
        type: string
      dry-run:
        description: "Dry run (no actual publish)"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - "CI Weekly"
    branches:
      - develop
    types:
      - completed

env:
  RELEASE_TYPE: ${{ github.event_name == 'workflow_run' && 'dev' || inputs.release-type }}
  DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && '--dry-run' || '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: upload

    permissions:
      id-token: write # Required by npm OIDC trusted publishing
      contents: write # Allows nx release to create tags and GitHub releases
      packages: read

    steps:
      - name: Import Secrets
        id: import-secrets
        uses: LanceMcCarthy/akeyless-action@v5
        with:
          access-id: ${{ secrets.GH_AKEYLESS_ACCESS_ID }}
          static-secrets: '{ "/WebComponents/prod/tokens/GH_TOKEN": "GH_TOKEN" }'
          export-secrets-to-environment: false

      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TYPE == 'stable' && 'master' || 'develop' }}
          fetch-depth: "0"
          token: ${{ steps.import-secrets.outputs.GH_TOKEN }}

      - name: Setup git
        run: |
          git config user.name "kendo-bot"
          git config user.email "kendouiteam@progress.com"

      - name: Merge develop to master
        if: env.RELEASE_TYPE == 'stable'
        run: |
          git fetch --quiet
          git reset --hard origin/master
          git merge --ff-only --quiet origin/develop

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build themes for dist
        run: |
          npm run sass:dist
          npm run docs

      - name: Validate stable version
        if: env.RELEASE_TYPE == 'stable'
        run: |
          RELEASE_VERSION_INPUT="${{ inputs.version }}"

          if [[ -z "$RELEASE_VERSION_INPUT" ]]; then
            echo "Missing version input. Stable releases require an explicit version tag (example: v14.1.1)."
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable version '$RELEASE_VERSION_INPUT'. Use a v-prefixed tag, for example: v14.1.1"
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_VERSION_INPUT#v}"

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Nx release (stable)
        if: env.RELEASE_TYPE == 'stable'
        run: |
          npx nx release version "$RELEASE_VERSION" ${{ env.DRY_RUN }}
          npx nx release changelog "$RELEASE_VERSION" ${{ env.DRY_RUN }}
          npx nx release publish ${{ env.DRY_RUN }}
        env:
          GITHUB_TOKEN: ${{ steps.import-secrets.outputs.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Nx release (dev)
        if: env.RELEASE_TYPE == 'dev'
        run: |
          if [[ -n "${{ env.DRY_RUN }}" ]]; then
            VERSION_OUTPUT=$(mktemp)
            npx nx release version --preid dev --specifier prerelease --dry-run > "$VERSION_OUTPUT" 2>&1
            cat "$VERSION_OUTPUT"

            NEXT_DEV_VERSION=$(grep -E '^\+   "version": "[^"]+"' "$VERSION_OUTPUT" | head -n 1 | sed -E 's/^.*"version": "([^"]+)".*$/\1/')
            if [[ -n "$NEXT_DEV_VERSION" ]]; then
              echo "Computed next dev version: $NEXT_DEV_VERSION"
            else
              echo "Computed next dev version: not detected from Nx dry-run output."
            fi

            rm -f "$VERSION_OUTPUT"
            echo "Skipping dev changelog and publish in dry-run mode to avoid stale version resolution and interactive prompts."
          else
            npx nx release version --preid dev --specifier prerelease
            DEV_VERSION=$(jq -r '.version' packages/core/package.json)
            npx nx release changelog "$DEV_VERSION"
            npx nx release publish --tag dev
          fi
        env:
          GITHUB_TOKEN: ${{ steps.import-secrets.outputs.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Mark checks as successful
        if: env.DRY_RUN == ''
        run: |
          commit=$(git rev-parse HEAD)
          ./build/mark-checks.sh $commit
        env:
          GH_TOKEN: ${{ steps.import-secrets.outputs.GH_TOKEN }}

      - name: Push to GitHub
        if: env.DRY_RUN == ''
        run: |
          if [[ "${{ env.RELEASE_TYPE }}" == 'stable' ]]; then
            git push origin master --tags --quiet > /dev/null 2>&1
            git push origin master:develop --quiet > /dev/null 2>&1
          else
            git push origin develop --tags --quiet > /dev/null 2>&1
          fi
