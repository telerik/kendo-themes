name: Lint styles

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: lint-styles-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup and Install dependencies
        uses: ./.github/actions/setup

      - name: Lint styles
        run: |
          npm run lint:styles

