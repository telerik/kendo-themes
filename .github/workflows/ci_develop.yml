name: CI Develop

on:
  push:
    branches:
      - 'develop'

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Cache should be primed only from develop branch
  prime-cache:
    name: Prime cache
    uses: ./.github/workflows/_prime-cache.yml


  lint-scripts:
    name: Lint scripts
    uses: ./.github/workflows/_lint-scripts.yml
    needs: [ prime-cache ]


  lint-styles:
    name: Lint styles
    uses: ./.github/workflows/_lint-styles.yml
    needs: [ prime-cache ]


  # Every merge to develop must publish a baseline snapshot, so PRs branching
  # off develop have something to diff against (see reg-fetch-gh-pages-plugin).
  compile-themes:
    name: Compile themes
    uses: ./.github/workflows/_compile-themes.yml

  build-html:
    name: Build HTML devkit
    uses: ./.github/workflows/_build-html.yml

  create-screenshots:
    name: Create screenshots
    uses: ./.github/workflows/_create-screenshots.yml
    needs: [ compile-themes, build-html ]

  visual-regression:
    name: Visual regression
    needs: [ create-screenshots ]
    permissions:
      contents: write        # publish baseline to gh-pages
      pull-requests: write
    uses: ./.github/workflows/_visual-regression.yml
    with:
      baseline: true


  ci-develop:
    # The name of the last job is used for the branch protection status check
    name: CI Develop
    runs-on: ubuntu-latest
    needs: [ lint-scripts, lint-styles, visual-regression ]

    steps:

      # IMPORTANT NOTE (31.10.2020)
      #
      # You can not set a workflow to be status check. The job is. Hence the trickery...

      - name: Done
        run: echo "Done!"
