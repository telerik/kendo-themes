<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge theme stacks</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            color: #252525;
            background: #fff;
        }

        body {
            margin: 0;
            padding: 24px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
        }

        #themes {
            display: grid;
            grid-template-columns: repeat(5, minmax(180px, 1fr));
            gap: 16px;
            align-items: start;
        }

        .theme {
            min-width: 0;
        }

        .theme h2 {
            margin: 0 0 8px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }

        .theme iframe {
            display: block;
            width: 100%;
            height: 190px;
            border: 1px solid #d8d8d8;
            border-radius: 4px;
        }

        @media (max-width: 1100px) {
            #themes {
                grid-template-columns: repeat(3, minmax(180px, 1fr));
            }
        }

        @media (max-width: 700px) {
            #themes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Badge theme stacks</h1>
    <div id="themes"></div>
    <script>
        const themes = ['default', 'bootstrap', 'material', 'fluent', 'meridian'];
        const icon = `
            <span class="k-badge-icon k-icon k-svg-icon k-svg-i-plus-circle" aria-hidden="true">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path stroke-linecap="round" d="M8.25 12h7.5M12 8.25v7.5M21 12c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9Z" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                </svg>
            </span>`;

        function preview(theme) {
            return `<!doctype html>
                <html lang="en">
                <head>
                    <link rel="stylesheet" href="/packages/${theme}/dist/all.css">
                    <style>
                        body { margin: 0; padding: 12px; }
                        .stacks {
                            display: grid;
                            grid-template-columns: repeat(2, max-content);
                            gap: 16px;
                            align-items: start;
                        }
                        .stack {
                            display: grid;
                            gap: 8px;
                            justify-items: start;
                            white-space: nowrap;
                        }
                    </style>
                </head>
                <body>
                    <div class="stacks">
                        <div class="stack">
                            <span>Text</span>
                            <span><span class="k-badge k-badge-sm k-rounded-full"><span class="k-badge-text">Text</span></span></span>
                            <span><span class="k-badge k-badge-md k-rounded-full"><span class="k-badge-text">Text</span></span></span>
                            <span><span class="k-badge k-badge-lg k-rounded-full"><span class="k-badge-text">Text</span></span></span>
                        </div>
                        <div class="stack">
                            <span>Leading Icon + Text</span>
                            <span><span class="k-badge k-badge-sm k-rounded-full">${icon}<span class="k-badge-text">Text</span></span></span>
                            <span><span class="k-badge k-badge-md k-rounded-full">${icon}<span class="k-badge-text">Text</span></span></span>
                            <span><span class="k-badge k-badge-lg k-rounded-full">${icon}<span class="k-badge-text">Text</span></span></span>
                        </div>
                    </div>
                </body>
                </html>`;
        }

        for (const theme of themes) {
            const section = document.createElement('section');
            section.className = 'theme';
            section.innerHTML = `<h2>${theme}</h2>`;

            const frame = document.createElement('iframe');
            frame.title = `${theme} Badge stacks`;
            frame.srcdoc = preview(theme);
            section.append(frame);
            document.querySelector('#themes').append(section);
        }
    </script>
</body>
</html>
