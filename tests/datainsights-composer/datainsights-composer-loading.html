<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <div id="test-area">
            <div class="k-datainsights-composer">
                <div class="k-datainsights-composer-card">
                    <h2 class="k-datainsights-composer-title">What would you like to explore?</h2>
                    <div class="k-datainsights-composer-promptbox-group">
                        <div class="k-datainsights-composer-promptbox-generating k-input k-prompt-box k-prompt-box-multiline">
                            <div class="k-prompt-box-content">
                                <textarea class="k-prompt-box-textarea k-input-inner" aria-label="Prompt input" aria-multiline="true" placeholder="" rows="3">
                                    Describe the report you want to generate...
                                </textarea>
                                <div class="k-prompt-box-affix">
                                    <button class="k-button k-button-sm k-button-flat">
                                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-data" aria-hidden="true">
                                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5c0 2.4853-3.6937 4.5-8.25 4.5S3.75 9.9853 3.75 7.5m16.5 0C20.25 5.0147 16.5563 3 12 3S3.75 5.0147 3.75 7.5m16.5 0V12M3.75 7.5V12m0 0c0 2.4853 3.6938 4.5 8.25 4.5s8.25-2.0147 8.25-4.5m-16.5 0v4.5c0 2.4853 3.6938 4.5 8.25 4.5s8.25-2.0147 8.25-4.5V12" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                            </svg>
                                        </span>
                                        <span class="k-button-text">Data Source</span>
                                        <span class="k-badge k-badge-sm k-badge-base k-rounded-full">
                                            <span class="k-badge-text">2</span>
                                        </span>
                                    </button>
                                    <span class="k-spacer"></span>
                                    <button class="k-generating k-button k-button-sm k-rounded-full k-active" aria-label="Stop generating" aria-live="polite">
                                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-stop" aria-hidden="true">
                                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                <path d="M20.2489 5.2466v13.4999a1.5 1.5 0 0 1-1.5 1.5H5.249a1.5 1.5 0 0 1-1.5-1.5v-13.5a1.5 1.5 0 0 1 1.5-1.5H18.749a1.5 1.5 0 0 1 1.5 1.5"></path>
                                            </svg>
                                        </span>
                                        <span class="k-button-text">Generating</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="k-datainsights-composer-fields">
                            <div role="group" class="k-chip-list" aria-label="Data sources">
                                <div tabindex="0" aria-haspopup="true" class="k-chip k-chip-sm k-rounded-full" role="button">
                                    <span class="k-chip-icon k-icon k-svg-icon k-icon-sm k-svg-i-file-data" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25 14.25 3h-9a.75.75 0 0 0-.75.75v16.5a.75.75 0 0 0 .75.75h13.5a.7497.7497 0 0 0 .75-.75zM14.25 3v5.25h5.25M8.726 12.6346v1.7861m6.549 0v-1.7861m-6.5492 1.7993V16.22c0 .9864 1.4661 1.7861 3.2745 1.7861s3.2745-.7997 3.2745-1.7861v-1.7861m.0002-1.7982c0 .9864-1.466 1.7861-3.2745 1.7861-1.8084 0-3.2744-.7997-3.2744-1.7861s1.466-1.7861 3.2744-1.7861 3.2745.7997 3.2745 1.7861" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                    <span class="k-chip-content">
                                        <span class="k-chip-label">sales_orders</span>
                                    </span>
                                </div>
                                <div tabindex="-1" aria-haspopup="true" class="k-chip k-chip-sm k-rounded-full" role="button">
                                    <span class="k-chip-icon k-icon k-svg-icon k-icon-sm k-svg-i-file-text" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25 14.25 3h-9a.75.75 0 0 0-.75.75v16.5a.75.75 0 0 0 .75.75h13.5a.7497.7497 0 0 0 .75-.75zM14.25 3v5.25h5.25M9 12.75h6m-6 3h6" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                    <span class="k-chip-content">
                                        <span class="k-chip-label">sales_persona</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="k-datainsights-composer-report-content k-datainsights-composer-report-content-loading">
                        <div class="k-datainsights-composer-loading">
                            <div aria-label="Generating your report" class="k-loader k-loader-spinner-3" role="status">
                                <div class="k-loader-canvas">
                                    <span class="k-loader-segment"></span>
                                    <span class="k-loader-segment"></span>
                                    <span class="k-loader-segment"></span>
                                </div>
                            </div>
                            <span class="k-datainsights-composer-loading-message">Generating your report...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
