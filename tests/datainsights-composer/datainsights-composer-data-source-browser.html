<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            .k-animation-container {
            position: relative;
            }
        </style>
        <div id="test-area" class="k-d-flex k-gap-6">
            <section>
                <h3>All data sources</h3>
                <div class="k-animation-container k-animation-container-shown" role="region" aria-label="Data sources">
                    <div class="k-child-animation-container">
                        <div class="k-datainsights-composer-popup k-popup">
                            <span class="k-searchbox k-input">
                                <span class="k-input-icon k-icon k-svg-icon k-svg-i-search" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m15.8032 15.8037 5.1966 5.1966M18 10.5c0 4.1421-3.3579 7.5-7.5 7.5S3 14.6421 3 10.5 6.3579 3 10.5 3 18 6.3579 18 10.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                                <input aria-label="Search data sources" class="k-input-inner" placeholder="Search data sources" autocomplete="off" type="text" value="">
                            </span>
                            <div class="k-datainsights-composer-popup-tree k-treeview" aria-label="Data sources">
                                <ul class="k-treeview-lines k-treeview-group" role="tree">
                                    <li class="k-treeview-item" role="treeitem" aria-expanded="true" style="--kendo-treeview-level: 1;">
                                        <span class="k-treeview-item-content">
                                            <span class="k-treeview-toggle">
                                                <span class="k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                    </svg>
                                                </span>
                                            </span>
                                            <span class="k-treeview-leaf">
                                                <span class="k-treeview-leaf-text">sales_orders</span>
                                            </span>
                                        </span>
                                        <ul class="k-treeview-group" role="group">
                                            <li class="k-treeview-item" role="treeitem" style="--kendo-treeview-level: 1;">
                                                <span class="k-treeview-item-content">
                                                    <span class="k-treeview-leaf">
                                                        <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                                            <span class="k-chip-content">
                                                                <span class="k-chip-label">SalesOrderID</span>
                                                            </span>
                                                        </div>
                                                    </span>
                                                </span>
                                            </li>
                                            <li class="k-treeview-item" role="treeitem" style="--kendo-treeview-level: 1;">
                                                <span class="k-treeview-item-content">
                                                    <span class="k-treeview-leaf">
                                                        <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                                            <span class="k-chip-content">
                                                                <span class="k-chip-label">OrderDate</span>
                                                            </span>
                                                        </div>
                                                    </span>
                                                </span>
                                            </li>
                                            <li class="k-treeview-item" role="treeitem" style="--kendo-treeview-level: 1;">
                                                <span class="k-treeview-item-content">
                                                    <span class="k-treeview-leaf">
                                                        <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                                            <span class="k-chip-content">
                                                                <span class="k-chip-label">ShipDate</span>
                                                            </span>
                                                        </div>
                                                    </span>
                                                </span>
                                            </li>
                                            <li class="k-treeview-item" role="treeitem" style="--kendo-treeview-level: 1;">
                                                <span class="k-treeview-item-content">
                                                    <span class="k-treeview-leaf">
                                                        <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                                            <span class="k-chip-content">
                                                                <span class="k-chip-label">SubTotal</span>
                                                            </span>
                                                        </div>
                                                    </span>
                                                </span>
                                            </li>
                                            <li class="k-treeview-item" role="treeitem" style="--kendo-treeview-level: 1;">
                                                <span class="k-treeview-item-content">
                                                    <span class="k-treeview-leaf">
                                                        <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                                            <span class="k-chip-content">
                                                                <span class="k-chip-label">TaxAmt</span>
                                                            </span>
                                                        </div>
                                                    </span>
                                                </span>
                                            </li>
                                        </ul>
                                    </li>
                                    <li class="k-treeview-item" role="treeitem" aria-expanded="false" style="--kendo-treeview-level: 1;">
                                        <span class="k-treeview-item-content">
                                            <span class="k-treeview-toggle">
                                                <span class="k-icon k-svg-icon k-svg-i-chevron-right" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="m9 4.5 7.5 7.5L9 19.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                    </svg>
                                                </span>
                                            </span>
                                            <span class="k-treeview-leaf">
                                                <span class="k-treeview-leaf-text">sales_persona</span>
                                            </span>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section>
                <h3>Single data source</h3>
                <div class="k-animation-container k-animation-container-shown" role="region" aria-label="Data sources">
                    <div class="k-child-animation-container">
                        <div class="k-datainsights-composer-popup k-popup">
                            <div class="k-datainsights-composer-popup-title">sales_order</div>
                            <div class="k-datainsights-composer-popup-field-list k-chip-list" role="none">
                                <div role="presentation" tabindex="0" class="k-chip k-chip-outline k-rounded-full">
                                    <span class="k-chip-content">
                                        <span class="k-chip-label">SalesOrderID</span>
                                    </span>
                                </div>
                                <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                    <span class="k-chip-content">
                                        <span class="k-chip-label">OrderDate</span>
                                    </span>
                                </div>
                                <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                    <span class="k-chip-content">
                                        <span class="k-chip-label">ShipDate</span>
                                    </span>
                                </div>
                                <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                    <span class="k-chip-content">
                                        <span class="k-chip-label">SubTotal</span>
                                    </span>
                                </div>
                                <div role="presentation" tabindex="-1" class="k-chip k-chip-outline k-rounded-full">
                                    <span class="k-chip-content">
                                        <span class="k-chip-label">TaxAmt</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
