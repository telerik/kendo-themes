<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            .k-window {
            min-width: 400px;
            position: relative;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <section>
                <div class="k-spreadsheet-window k-window" role="dialog" aria-labelledby="k-window-title-1">
                    <div class="k-window-titlebar">
                        <span class="k-window-title" id="k-window-title-1">Custom Format</span>
                        <div class="k-window-titlebar-actions">
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="x">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="k-window-content">
                        <form class="k-form">
                            <div class="k-form-field">
                                <label class="k-form-label k-label">Category</label>
                                <div class="k-form-field-wrap">
                                    <span class="k-dropdownlist k-picker" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0">
                                        <span class="k-input-inner">
                                            <span class="k-input-value-text">Date</span>
                                        </span>
                                        <button class="k-input-button k-button k-icon-button" aria-label="Toggle dropdown" tabindex="-1">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                                </svg>
                                            </span>
                                        </button>
                                    </span>
                                </div>
                            </div>
                            <div class="k-form-field">
                                <label class="k-form-label k-label">Sample</label>
                                <div class="k-form-field-wrap">
                                    <span class="k-dateinput k-input">
                                        <input class="k-input-inner" placeholder="" autocomplete="off" type="text" value="1/17/2022">
                                    </span>
                                </div>
                            </div>
                            <div class="k-form-field">
                                <label class="k-form-label k-label">Symbol</label>
                                <div class="k-form-field-wrap">
                                    <div class="k-listbox k-listbox-actions-left" style="width: 100%;">
                                        <div class="k-list-scroller k-selectable">
                                            <div class="k-list">
                                                <div class="k-list-content">
                                                    <ul role="listbox" class="k-list-ul">
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">1/17/2022</span>
                                                        </li>
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">Monday, January 17, 2022</span>
                                                        </li>
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">Monday, January 17, 2022 6:25:37 PM</span>
                                                        </li>
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">1/17/2022 6:25 PM</span>
                                                        </li>
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">1/17/2022 6:25:37 PM</span>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="k-actions k-actions-start k-actions-horizontal k-window-actions">
                        <button class="k-button k-button-primary">
                            <span class="k-button-text">Apply</span>
                        </button>
                        <button class="k-button">
                            <span class="k-button-text">Cancel</span>
                        </button>
                    </div>
                </div>
            </section>
            <section>
                <div class="k-spreadsheet-window k-window" role="dialog" aria-labelledby="k-window-title-2">
                    <div class="k-window-titlebar">
                        <span class="k-window-title" id="k-window-title-2">Conditional Formatting</span>
                        <div class="k-window-titlebar-actions">
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="x">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="k-window-content">
                        <form class="k-form">
                            <div class="k-form-field">
                                <label class="k-form-label k-label">Apply to range</label>
                                <div class="k-form-field-wrap">
                                    <span class="k-textbox k-input">
                                        <input class="k-input-inner" placeholder="Placeholder" autocomplete="off" type="text" value="">
                                    </span>
                                </div>
                            </div>
                            <div class="k-form-field">
                                <label class="k-form-label k-label">Format cells if</label>
                                <div class="k-form-field-wrap">
                                    <span class="k-dropdownlist k-picker" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0">
                                        <span class="k-input-inner">
                                            <span class="k-input-value-text">Cell value</span>
                                        </span>
                                        <button class="k-input-button k-button k-icon-button" aria-label="Toggle dropdown" tabindex="-1">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                                </svg>
                                            </span>
                                        </button>
                                    </span>
                                </div>
                            </div>
                            <div class="k-form-field">
                                <label class="k-form-label k-label">is</label>
                                <div class="k-form-field-wrap">
                                    <span class="k-dropdownlist k-picker" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0">
                                        <span class="k-input-inner">
                                            <span class="k-input-value-text">Greater than</span>
                                        </span>
                                        <button class="k-input-button k-button k-icon-button" aria-label="Toggle dropdown" tabindex="-1">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                                </svg>
                                            </span>
                                        </button>
                                    </span>
                                </div>
                            </div>
                            <div class="k-form-field">
                                <label class="k-form-label k-label">Apply to range</label>
                                <div class="k-form-field-wrap">
                                    <span class="k-textbox k-input">
                                        <input class="k-input-inner" placeholder="Placeholder" autocomplete="off" type="text" value="">
                                    </span>
                                </div>
                            </div>
                            <div class="k-form-field">
                                <label class="k-form-label k-label">Format with</label>
                                <div class="k-form-field-wrap">
                                    <div class="k-toolbar k-toolbar-resizable" role="toolbar" aria-label="Toolbar">
                                        <button class="k-toolbar-button  k-button k-icon-button">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-bold" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 11.25H15m0 0c.9946 0 1.9484.3951 2.6517 1.0983a3.7503 3.7503 0 0 1 0 5.3034A3.75 3.75 0 0 1 15 18.75H7.5V4.5h6.375a3.3752 3.3752 0 0 1 2.3865 5.7615 3.375 3.375 0 0 1-2.3865.9885z" fill="none"></path>
                                                </svg>
                                            </span>
                                        </button>
                                        <button class="k-toolbar-button  k-button k-icon-button">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-italic" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.25 5.25-4.5 13.5m4.5-13.5H10.5m3.75 0H18m-8.25 13.5H6m3.75 0h3.75" fill="none"></path>
                                                </svg>
                                            </span>
                                        </button>
                                        <button class="k-toolbar-button  k-button k-icon-button">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-underline" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 21h12m-.75-15.75v7.5a5.2499 5.2499 0 0 1-8.9623 3.7123A5.25 5.25 0 0 1 6.75 12.75v-7.5" fill="none"></path>
                                                </svg>
                                            </span>
                                        </button>
                                        <button class="k-toolbar-button  k-button k-icon-button">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-strikethrough" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5M7.156 9a2.41 2.41 0 0 1-.1144-.75C7.0416 6.179 9.104 4.5 12 4.5c2.1562 0 3.7725.9253 4.5 2.25m-9.75 9c0 2.0709 2.3503 3.75 5.25 3.75s5.25-1.6791 5.25-3.75c0-2.2284-2.0269-3.0938-4.275-3.75" fill="none"></path>
                                                </svg>
                                            </span>
                                        </button>
                                        <span class="k-toolbar-colorpicker  k-colorpicker k-icon-picker k-picker" role="combobox" aria-haspopup="dialog" aria-expanded="false" aria-label="Color picker" tabindex="0">
                                            <span class="k-input-inner">
                                                <span class="k-value-icon k-color-preview k-icon-color-preview">
                                                    <span class="k-color-preview-icon k-icon k-svg-icon k-svg-i-foreground-color" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 20.1992H3.7501M18 17.2 12 4.45 6 17.2m10.2356-3.75H7.7644" fill="none"></path>
                                                        </svg>
                                                    </span>
                                                    <span class="k-color-preview-mask" style="background-color: red;"></span>
                                                </span>
                                            </span>
                                            <button class="k-input-button k-button k-icon-button" tabindex="-1" aria-label="Open color picker">
                                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                                    </svg>
                                                </span>
                                            </button>
                                        </span>
                                        <span class="k-toolbar-colorpicker  k-colorpicker k-icon-picker k-picker" role="combobox" aria-haspopup="dialog" aria-expanded="false" aria-label="Color picker" tabindex="0">
                                            <span class="k-input-inner">
                                                <span class="k-value-icon k-color-preview k-icon-color-preview">
                                                    <span class="k-color-preview-icon k-icon k-svg-icon k-svg-i-droplet" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12.75 18c1.875-.3159 3.4322-1.875 3.75-3.75m3-.75c0-6.75-7.5-12-7.5-12s-7.5 5.25-7.5 12a7.5 7.5 0 0 0 15 0" fill="none"></path>
                                                        </svg>
                                                    </span>
                                                    <span class="k-color-preview-mask" style="background-color: fuchsia;"></span>
                                                </span>
                                            </span>
                                            <button class="k-input-button k-button k-icon-button" tabindex="-1" aria-label="Open color picker">
                                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                                    </svg>
                                                </span>
                                            </button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="k-actions k-actions-start k-actions-horizontal k-window-actions">
                        <button class="k-button k-button-primary">
                            <span class="k-button-text">Apply</span>
                        </button>
                        <button class="k-button">
                            <span class="k-button-text">Cancel</span>
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
