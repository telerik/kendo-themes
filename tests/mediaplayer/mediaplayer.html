<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            .k-mediaplayer {
            height: 360px;
            }
            .k-slider-horizontal {
            --kendo-slider-start: 0;
            --kendo-slider-end: 50;
            }
        </style>
        <div id="test-area" class="k-d-grid">
            <div class="k-mediaplayer">
                <div class="k-mediaplayer-titlebar">Media player title</div>
                <div class="k-mediaplayer-toolbar-wrap">
                    <div aria-label="Slider" class="k-slider k-mediaplayer-seekbar k-slider-horizontal">
                        <div class="k-slider-track-wrap">
                            <div class="k-slider-track">
                                <div class="k-slider-selection"></div>
                                <span class="k-draghandle k-draghandle-end" role="slider" tabindex="0" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" aria-label="Slider"></span>
                            </div>
                        </div>
                    </div>
                    <div class="k-mediaplayer-toolbar k-toolbar" role="toolbar" aria-label="Toolbar">
                        <button class="k-toolbar-button k-play-button k-button k-button-flat k-icon-button" aria-pressed="false" aria-label="Play">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-play" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3.74v16.5225a.75.75 0 0 0 1.139.6272l13.5076-8.2613a.732.732 0 0 0 .3535-.6272.733.733 0 0 0-.3535-.6272L7.8891 3.1128A.75.75 0 0 0 6.75 3.74" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                </svg>
                            </span>
                        </button>
                        <div class="k-mediaplayer-currenttime-wrap k-toolbar-item">
                            <span class="k-mediaplayer-currenttime">00:18</span>
                            /
                            <span class="k-mediaplayer-duration">00:55</span>
                        </div>
                        <div class="k-spacer"></div>
                        <button class="k-toolbar-button k-volume-button k-button k-button-flat k-icon-button" aria-pressed="false" aria-label="Mute">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-volume-up" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 15.75H3a.75.75 0 0 1-.75-.75V9A.75.75 0 0 1 3 8.25h4.5m0 7.5L14.25 21V3L7.5 8.25m0 7.5v-7.5M18 10.0172a3 3 0 0 1 0 3.9656M20.7816 7.5a6.75 6.75 0 0 1 0 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                </svg>
                            </span>
                        </button>
                        <div class="k-mediaplayer-volume-wrap k-toolbar-item">
                            <div aria-label="Slider" class="k-slider k-mediaplayer-volume k-slider-horizontal">
                                <div class="k-slider-track-wrap">
                                    <div class="k-slider-track">
                                        <div class="k-slider-selection"></div>
                                        <span class="k-draghandle k-draghandle-end" role="slider" tabindex="0" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" aria-label="Slider"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button class="k-toolbar-button k-fullscreen-button k-button k-button-flat k-icon-button" aria-pressed="false" aria-label="Full screen">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-fullscreen" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9V4.5H15m4.5 0-5.25 5.25M4.5 15v4.5H9m-4.5 0 5.25-5.25M15 19.5h4.5V15m0 4.5-5.25-5.25M9 4.5H4.5V9m0-4.5 5.25 5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>
                <div class="k-mediaplayer-overlay"></div>
            </div>
        </div>
    </body>
</html>
