<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            .k-window {
            width: 100%;
            position: relative;
            }
            .k-form-label {
            align-items: flex-start !important;
            }
            /* needed for test */
            .k-editor-content > .ProseMirror {
            white-space: normal;
            }
            .k-form-horizontal .k-form-field:nth-child(3) .k-form-field-wrap {
            max-width: initial;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <span>Find Window</span>
            <span>Replace Window</span>
            <section>
                <div class="k-window" role="dialog" aria-labelledby="k-window-title-1">
                    <div class="k-window-titlebar">
                        <span class="k-window-title" id="k-window-title-1">Find and Replace</span>
                        <div class="k-window-titlebar-actions">
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="x">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="k-window-content">
                        <div class="k-tabstrip k-editor-find-replace k-tabstrip-top">
                            <div class="k-tabstrip-items-wrapper k-hstack">
                                <ul class="k-tabstrip-items k-reset k-tabstrip-items-start" role="tablist">
                                    <li class="k-tabstrip-item k-active" role="tab" aria-selected="true">
                                        <span class="k-link">
                                            <span class="k-link-text">Find</span>
                                        </span>
                                    </li>
                                    <li class="k-tabstrip-item" role="tab">
                                        <span class="k-link">
                                            <span class="k-link-text">Replace</span>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                            <div class="k-tabstrip-content k-active" role="tabpanel">
                                <div class="k-form">
                                    <div class="k-form-field">
                                        <label class="k-form-label k-label">Find What:</label>
                                        <div class="k-form-field-wrap">
                                            <span class="k-textbox k-input">
                                                <input class="k-input-inner" placeholder="" autocomplete="off" type="text" value="editor">
                                            </span>
                                        </div>
                                    </div>
                                    <div class="k-form-field">
                                        <div class="k-form-field-wrap">
                                            <ul class="k-search-options k-checkbox-list k-list-vertical">
                                                <li class="k-checkbox-list-item">
                                                    <span class="k-checkbox-wrap">
                                                        <input id="cb-label-after" class="k-checkbox" type="checkbox">
                                                    </span>
                                                    <label class="k-checkbox-label" for="cb-label-after">Match case</label>
                                                </li>
                                                <li class="k-checkbox-list-item">
                                                    <span class="k-checkbox-wrap">
                                                        <input id="cb-label-after" class="k-checkbox" type="checkbox">
                                                    </span>
                                                    <label class="k-checkbox-label" for="cb-label-after">Match whole word only</label>
                                                </li>
                                                <li class="k-checkbox-list-item">
                                                    <span class="k-checkbox-wrap">
                                                        <input id="cb-label-after" class="k-checkbox" type="checkbox">
                                                    </span>
                                                    <label class="k-checkbox-label" for="cb-label-after">Match cyclic (Wrap around)</label>
                                                </li>
                                                <li class="k-checkbox-list-item">
                                                    <span class="k-checkbox-wrap">
                                                        <input id="cb-label-after" class="k-checkbox" type="checkbox">
                                                    </span>
                                                    <label class="k-checkbox-label" for="cb-label-after">Regular Expression</label>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                    <div class="k-matches-container">
                                        <button class="k-button k-button-flat k-button-primary">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-left" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.5 7.5 12 15 4.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                            <span class="k-button-text">Prev</span>
                                        </button>
                                        <span>1 of 3 matches</span>
                                        <button class="k-button k-button-flat k-button-primary">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-right" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="m9 4.5 7.5 7.5L9 19.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                            <span class="k-button-text">Next</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section>
                <div class="k-editor-window k-window" role="dialog" aria-labelledby="k-window-title-2">
                    <div class="k-window-titlebar">
                        <span class="k-window-title" id="k-window-title-2">Find and Replace</span>
                        <div class="k-window-titlebar-actions">
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="x">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="k-window-content">
                        <div class="k-tabstrip k-editor-find-replace k-tabstrip-top">
                            <div class="k-tabstrip-items-wrapper k-hstack">
                                <ul class="k-tabstrip-items k-reset k-tabstrip-items-start" role="tablist">
                                    <li class="k-tabstrip-item" role="tab">
                                        <span class="k-link">
                                            <span class="k-link-text">Find</span>
                                        </span>
                                    </li>
                                    <li class="k-tabstrip-item k-active" role="tab" aria-selected="true">
                                        <span class="k-link">
                                            <span class="k-link-text">Replace</span>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                            <div class="k-tabstrip-content k-active" role="tabpanel">
                                <div class="k-form">
                                    <div class="k-form-field">
                                        <label class="k-form-label k-label">Find What:</label>
                                        <div class="k-form-field-wrap">
                                            <span class="k-textbox k-input">
                                                <input class="k-input-inner" placeholder="" autocomplete="off" type="text" value="editor">
                                            </span>
                                        </div>
                                    </div>
                                    <div class="k-form-field">
                                        <label class="k-form-label k-label">Replace With:</label>
                                        <div class="k-form-field-wrap">
                                            <span class="k-textbox k-input">
                                                <input class="k-input-inner" placeholder="" autocomplete="off" type="text" value="grid">
                                            </span>
                                        </div>
                                    </div>
                                    <div class="k-form-field">
                                        <div class="k-form-field-wrap">
                                            <div class="k-actions k-actions-end k-actions-horizontal">
                                                <button class="k-button">
                                                    <span class="k-button-text">Replace</span>
                                                </button>
                                                <button class="k-button">
                                                    <span class="k-button-text">Replace All</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-form-field">
                                        <div class="k-form-field-wrap">
                                            <ul class="k-search-options k-checkbox-list k-list-vertical">
                                                <li class="k-checkbox-list-item">
                                                    <span class="k-checkbox-wrap">
                                                        <input id="cb-label-after" class="k-checkbox" type="checkbox">
                                                    </span>
                                                    <label class="k-checkbox-label" for="cb-label-after">Match case</label>
                                                </li>
                                                <li class="k-checkbox-list-item">
                                                    <span class="k-checkbox-wrap">
                                                        <input id="cb-label-after" class="k-checkbox" type="checkbox">
                                                    </span>
                                                    <label class="k-checkbox-label" for="cb-label-after">Match whole word only</label>
                                                </li>
                                                <li class="k-checkbox-list-item">
                                                    <span class="k-checkbox-wrap">
                                                        <input id="cb-label-after" class="k-checkbox" type="checkbox">
                                                    </span>
                                                    <label class="k-checkbox-label" for="cb-label-after">Match cyclic (Wrap around)</label>
                                                </li>
                                                <li class="k-checkbox-list-item">
                                                    <span class="k-checkbox-wrap">
                                                        <input id="cb-label-after" class="k-checkbox" type="checkbox">
                                                    </span>
                                                    <label class="k-checkbox-label" for="cb-label-after">Regular Expression</label>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                    <div class="k-matches-container">
                                        <button class="k-button k-button-flat k-button-primary">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-left" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.5 7.5 12 15 4.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                            <span class="k-button-text">Prev</span>
                                        </button>
                                        <span>1 of 3 matches</span>
                                        <button class="k-button k-button-flat k-button-primary">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-right" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="m9 4.5 7.5 7.5L9 19.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                            <span class="k-button-text">Next</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <span>Text Highlight</span>
            <span></span>
            <section>
                <div class="k-editor" style="height: 150px;">
                    <div class="k-editor-toolbar k-toolbar" role="toolbar" aria-label="Toolbar">
                        <div role="group" class="k-toolbar-button-group  k-button-group">
                            <button class="k-group-start k-button k-icon-button">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-bold" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 11.25H15m0 0c.9946 0 1.9484.3951 2.6517 1.0983a3.7503 3.7503 0 0 1 0 5.3034A3.75 3.75 0 0 1 15 18.75H7.5V4.5h6.375a3.3752 3.3752 0 0 1 2.3865 5.7615 3.375 3.375 0 0 1-2.3865.9885z" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-button k-icon-button">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-italic" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m14.25 5.25-4.5 13.5m4.5-13.5H10.5m3.75 0H18m-8.25 13.5H6m3.75 0h3.75" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-button k-icon-button">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-underline" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 21h12m-.75-15.75v7.5a5.2499 5.2499 0 0 1-8.9623 3.7123A5.25 5.25 0 0 1 6.75 12.75v-7.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-group-end k-button k-selected k-icon-button">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-binoculars" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 8.249h4.5m7.2741 6.2173L17.4319 5.155a2.2503 2.2503 0 0 0-3.1819 0v10.5938m0 0c0 2.0711 1.6789 3.7502 3.75 3.7502s3.75-1.6789 3.75-3.75-1.6789-3.75-3.75-3.75-3.75 1.6787-3.75 3.7498m-4.4999 0V5.1551a2.25 2.25 0 0 0-3.1818 0L2.476 14.4663m7.274 1.2825c0 2.0711-1.679 3.7502-3.7501 3.7502-2.071 0-3.75-1.6789-3.75-3.75s1.679-3.75 3.75-3.75 3.7501 1.6787 3.7501 3.7498" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="k-editor-content" contenteditable="true" role="textbox" aria-label="Editor content">
                        <div class="ProseMirror">
                            <span class="k-text-selected">Word</span>
                            and few more
                            <span class="k-text-highlighted">word</span>
                            s. And yet again.
                            <span class="k-text-highlighted">Word</span>
                            .
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
