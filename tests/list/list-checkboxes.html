<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <div id="test-area" class="k-d-grid">
            <section>
                <div class="k-list">
                    <div class="k-list-content">
                        <ul aria-label="Options" id="list-checkboxes-listbox" role="listbox" class="k-list-ul">
                            <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                <span class="k-checkbox-wrap">
                                    <input aria-label="Unchecked" tabindex="-1" class="k-checkbox" type="checkbox">
                                </span>
                                <span class="k-list-item-text">Unchecked</span>
                            </li>
                            <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                <span class="k-checkbox-wrap">
                                    <input aria-label="Checked" tabindex="-1" class="k-checkbox k-checked" type="checkbox" checked="">
                                </span>
                                <span class="k-list-item-text">Checked</span>
                            </li>
                            <li role="option" tabindex="-1" aria-selected="false" aria-disabled="true" class="k-list-item k-disabled">
                                <span class="k-checkbox-wrap">
                                    <input aria-label="Disabled" tabindex="-1" disabled="" class="k-checkbox k-disabled" type="checkbox">
                                </span>
                                <span class="k-list-item-text">Disabled</span>
                            </li>
                            <li role="option" tabindex="-1" aria-selected="false" aria-disabled="true" class="k-list-item k-disabled">
                                <span class="k-checkbox-wrap">
                                    <input aria-label="Checked + disabled" tabindex="-1" disabled="" class="k-checkbox k-checked k-disabled" type="checkbox" checked="">
                                </span>
                                <span class="k-list-item-text">Checked + disabled</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
