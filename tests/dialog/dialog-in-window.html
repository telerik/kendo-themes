<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            #test-area {
            width: 500px;
            transform: translate( 0, 0 );
            }
            .k-window {
            width: 100%;
            height: 400px;
            position: relative;
            }
            .k-dialog {
            width: 300px;
            height: 200px;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-1">
            <section>
                <div class="k-window-wrapper k-window" role="dialog" aria-labelledby="k-window-title-1">
                    <div class="k-window-titlebar">
                        <span class="k-window-title" id="k-window-title-1">Window with dialog</span>
                        <div class="k-window-titlebar-actions">
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="window-minimize">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-window-minimize" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 17h16.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="window">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-window" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M6.7544 7.875a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0M10.5034 7.875a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 4.5H3.75a.75.75 0 0 0-.75.75v13.5a.75.75 0 0 0 .75.75h16.5a.75.75 0 0 0 .75-.75V5.25a.75.75 0 0 0-.75-.75" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.7544 7.875a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0M10.5034 7.875a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="x">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="k-window-content">
                        Window content
                        <div class="k-dialog-wrapper">
                            <div class="k-overlay"></div>
                            <div class="k-dialog k-window" role="dialog" aria-labelledby="k-dialog-titlebar-1" aria-describedby="k-dialog-content-1" aria-modal="true">
                                <div class="k-window-titlebar k-dialog-titlebar" id="k-dialog-titlebar-1">
                                    <span class="k-window-title k-dialog-title">Dialog in window</span>
                                    <div class="k-window-titlebar-actions k-dialog-titlebar-actions">
                                        <button class="k-window-titlebar-action k-dialog-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="x">
                                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                        </button>
                                    </div>
                                </div>
                                <div class="k-window-content k-dialog-content" id="k-dialog-content-1">Dialog content</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
