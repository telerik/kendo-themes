<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            .k-window {
            min-width: 580px;
            position: relative;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <section>
                <div class="k-window" role="dialog" aria-labelledby="k-window-title-1">
                    <div class="k-window-titlebar">
                        <span class="k-window-title" id="k-window-title-1">Edit task</span>
                        <div class="k-window-titlebar-actions">
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="window-minimize">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-window-minimize" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 17h16.5" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="window">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-window" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path d="M6.7544 7.875a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0M10.5034 7.875a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 4.5H3.75a.75.75 0 0 0-.75.75v13.5a.75.75 0 0 0 .75.75h16.5a.75.75 0 0 0 .75-.75V5.25a.75.75 0 0 0-.75-.75" fill="none"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.7544 7.875a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0M10.5034 7.875a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-window-titlebar-action k-button k-button-xs k-button-flat k-icon-button" aria-label="x">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="k-window-content">
                        <div class="k-tabstrip k-tabstrip-top">
                            <div class="k-tabstrip-items-wrapper k-hstack">
                                <ul class="k-tabstrip-items k-reset k-tabstrip-items-start" role="tablist">
                                    <li class="k-tabstrip-item k-first" role="tab">
                                        <span class="k-link">
                                            <span class="k-link-text">General</span>
                                        </span>
                                    </li>
                                    <li class="k-tabstrip-item" role="tab">
                                        <span class="k-link">
                                            <span class="k-link-text">Resources</span>
                                        </span>
                                    </li>
                                    <li class="k-tabstrip-item" role="tab">
                                        <span class="k-link">
                                            <span class="k-link-text">Predecessors</span>
                                        </span>
                                    </li>
                                    <li class="k-tabstrip-item" role="tab">
                                        <span class="k-link">
                                            <span class="k-link-text">Successors</span>
                                        </span>
                                    </li>
                                    <li class="k-tabstrip-item k-active k-last" role="tab" aria-selected="true">
                                        <span class="k-link">
                                            <span class="k-link-text">Other</span>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                            <div class="k-tabstrip-content k-active" role="tabpanel">
                                <div class="k-form">
                                    <div class="k-form-field">
                                        <label class="k-form-label k-label">
                                            Notes
                                            <span class="k-label-optional">(Optional)</span>
                                        </label>
                                        <div class="k-form-field-wrap">
                                            <span class="k-textarea !k-flex-col k-input">
                                                <textarea class="!k-overflow-auto !k-flex-none k-resize k-input-inner" placeholder="Placeholder"></textarea>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="k-form-field">
                                        <label class="k-form-label k-label">Text data field label</label>
                                        <div class="k-form-field-wrap">
                                            <span class="k-textbox k-input">
                                                <input class="k-input-inner" placeholder="Placeholder" autocomplete="off" type="text" value="">
                                            </span>
                                        </div>
                                    </div>
                                    <div class="k-form-field">
                                        <label class="k-form-label k-label">Date data field label</label>
                                        <div class="k-form-field-wrap">
                                            <span class="k-datepicker k-input">
                                                <input role="combobox" aria-haspopup="grid" aria-expanded="false" aria-label="Select date" class="k-input-inner" placeholder="dd/MM/yyyy" autocomplete="off" type="text" value="">
                                                <button class="k-input-button k-button k-icon-button" tabindex="-1" aria-label="Select date">
                                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-calendar" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path d="M12.75 14.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0"></path>
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 2.25v3m-9-3v3m-3.75 3h16.5M4.5 3.75h15a.75.75 0 0 1 .75.75v15a.75.75 0 0 1-.75.75h-15a.75.75 0 0 1-.75-.75v-15a.75.75 0 0 1 .75-.75m8.25 10.5a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0" fill="none"></path>
                                                        </svg>
                                                    </span>
                                                </button>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="k-form-field">
                                        <label class="k-form-label k-label">Numeric data field label</label>
                                        <div class="k-form-field-wrap">
                                            <span class="k-numerictextbox k-input">
                                                <input role="spinbutton" class="k-input-inner" placeholder="##,##" autocomplete="off" type="text" value="">
                                                <span class="k-spin-button k-input-spinner">
                                                    <button class="k-spinner-increase k-button k-icon-button" aria-label="Increase value">
                                                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-up" aria-hidden="true">
                                                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15 12 7.5l7.5 7.5" fill="none"></path>
                                                            </svg>
                                                        </span>
                                                    </button>
                                                    <button class="k-spinner-decrease k-button k-icon-button" aria-label="Decrease value">
                                                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                                            </svg>
                                                        </span>
                                                    </button>
                                                </span>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="k-form-field">
                                        <div class="k-form-field-wrap">
                                            <span class="k-checkbox-wrap">
                                                <input class="k-checkbox k-checked" type="checkbox" checked="">
                                            </span>
                                            <label class="k-checkbox-label">Boolean data field label</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="k-actions k-actions-start k-actions-horizontal k-window-actions">
                        <button class="k-button k-button-primary">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-save" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 20.25v-6a.75.75 0 0 1 .75-.75h7.5a.7497.7497 0 0 1 .75.75v6m-2.25-13.5H9m11.25 1.0603V19.5a.7497.7497 0 0 1-.75.75h-15a.75.75 0 0 1-.75-.75v-15a.75.75 0 0 1 .75-.75h11.6897c.1986 0 .3891.079.5297.2194l3.3112 3.3112a.75.75 0 0 1 .2194.5297" fill="none"></path>
                                </svg>
                            </span>
                            <span class="k-button-text">Save</span>
                        </button>
                        <button class="k-button">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-cancel" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-miterlimit="10" d="M18.3637 18.3642 5.6362 5.6367M21 12c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9Z" fill="none"></path>
                                </svg>
                            </span>
                            <span class="k-button-text">Cancel</span>
                        </button>
                        <span class="k-spacer"></span>
                        <button class="k-button k-button-flat k-button-primary">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-trash" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 5.25H3.75m6 4.5v6m4.5-6v6m4.5-10.5V19.5a.7497.7497 0 0 1-.75.75H6a.75.75 0 0 1-.75-.75V5.25m10.5 0v-1.5a1.5 1.5 0 0 0-1.5-1.5h-4.5a1.5 1.5 0 0 0-1.5 1.5v1.5" fill="none"></path>
                                </svg>
                            </span>
                            <span class="k-button-text">Delete</span>
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
