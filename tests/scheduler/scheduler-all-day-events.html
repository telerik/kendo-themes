<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            #test-area {
            max-width: 1080px;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-1">
            <div class="k-scheduler" role="application">
                <div class="k-scheduler-toolbar k-toolbar" aria-label="Toolbar" role="toolbar">
                    <button class="k-toolbar-button  k-button k-button-primary" aria-label="Add new event">
                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-plus" aria-hidden="true">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                <path d="M288 224V96h-64v128H96v64h128v128h64V288h128v-64z"></path>
                            </svg>
                        </span>
                        <span class="k-button-text">New Event</span>
                    </button>
                    <button class="k-toolbar-button  k-button k-button-flat">
                        <span class="k-button-text">Today</span>
                    </button>
                    <div role="group" class="k-toolbar-button-group  k-button-group k-button-group-flat">
                        <button class="k-button k-button-flat k-icon-button" aria-label="Navigate to previous period">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-left" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                    <path d="m353.941 382.059-126.06-126.06 126.06-126.061L320 96 160 255.999 320 416z"></path>
                                </svg>
                            </span>
                        </button>
                        <button class="k-button k-button-flat k-icon-button" aria-label="Navigate to next period">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-right" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                    <path d="m158.059 129.941 126.06 126.06-126.06 126.061L192 416l160-159.999L192 96z"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                    <button class="k-toolbar-button k-nav-current k-button k-button-flat" aria-live="polite">
                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-calendar" aria-hidden="true">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                <path d="M416 416H288V288h128zm64-352v384c0 17.6-14.4 32-32 32H64c-17.6 0-32-14.4-32-32V64c0-17.6 14.4-32 32-32h64V0h64v32h128V0h64v32h64c17.6 0 32 14.4 32 32m-32 128H64v255.9l.1.1 383.9-.1zm0-127.9q-.15-.15 0 0l-64-.1v32h-64V64H192v32h-64V64H64.1l-.1.1V160h384z"></path>
                            </svg>
                        </span>
                        <span class="k-button-text">June 21 - June 27</span>
                    </button>
                    <span class="k-spacer"></span>
                    <div class="k-scheduler-views k-segmented-control" role="group">
                        <div class="k-segmented-control-thumb" aria-hidden="true" style="width: 19%; left: 15%;"></div>
                        <button class="k-segmented-control-button" aria-pressed="false" tabindex="-1">
                            <span class="k-segmented-control-button-text">Day</span>
                        </button>
                        <button class="k-segmented-control-button k-selected" aria-pressed="true" tabindex="0">
                            <span class="k-segmented-control-button-text">Week</span>
                        </button>
                        <button class="k-segmented-control-button" aria-pressed="false" tabindex="-1">
                            <span class="k-segmented-control-button-text">Month</span>
                        </button>
                        <button class="k-segmented-control-button" aria-pressed="false" tabindex="-1">
                            <span class="k-segmented-control-button-text">Timeline</span>
                        </button>
                        <button class="k-segmented-control-button" aria-pressed="false" tabindex="-1">
                            <span class="k-segmented-control-button-text">Agenda</span>
                        </button>
                    </div>
                </div>
                <table class="k-scheduler-layout k-scheduler-weekview" role="none">
                    <tbody>
                        <tr class="k-scheduler-head">
                            <td>
                                <div class="k-scheduler-times">
                                    <table role="none" class="k-scheduler-table">
                                        <tbody>
                                            <tr style="height: 55px;">
                                                <th role="presentation" class="k-scheduler-cell"></th>
                                            </tr>
                                            <tr style="height: 86px;">
                                                <th class="k-scheduler-cell k-scheduler-times-all-day">all day</th>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </td>
                            <td>
                                <div class="k-scheduler-header" style="padding-right: 16px;">
                                    <div class="k-scheduler-header-wrap">
                                        <table class="k-scheduler-table">
                                            <tbody>
                                                <tr class="k-scheduler-date-group">
                                                    <th class="k-scheduler-cell">
                                                        <span class="k-scheduler-date-day">Sun</span>
                                                        <span class="k-link k-nav-day" aria-label="Sun 21">21</span>
                                                    </th>
                                                    <th class="k-scheduler-cell">
                                                        <span class="k-scheduler-date-day">Mon</span>
                                                        <span class="k-link k-nav-day" aria-label="Mon 22">22</span>
                                                    </th>
                                                    <th class="k-scheduler-cell">
                                                        <span class="k-scheduler-date-day">Tue</span>
                                                        <span class="k-link k-nav-day" aria-label="Tue 23">23</span>
                                                    </th>
                                                    <th class="k-scheduler-cell k-today">
                                                        <span class="k-scheduler-date-day">Wed</span>
                                                        <span class="k-link k-nav-day" aria-label="Wed 24">24</span>
                                                    </th>
                                                    <th class="k-scheduler-cell">
                                                        <span class="k-scheduler-date-day">Thu</span>
                                                        <span class="k-link k-nav-day" aria-label="Thu 25">25</span>
                                                    </th>
                                                    <th class="k-scheduler-cell">
                                                        <span class="k-scheduler-date-day">Fri</span>
                                                        <span class="k-link k-nav-day" aria-label="Fri 26">26</span>
                                                    </th>
                                                    <th class="k-scheduler-cell">
                                                        <span class="k-scheduler-date-day">Sat</span>
                                                        <span class="k-link k-nav-day" aria-label="Sat 27">27</span>
                                                    </th>
                                                </tr>
                                            </tbody>
                                        </table>
                                        <div style="position: relative;">
                                            <table class="k-scheduler-table k-scheduler-header-all-day">
                                                <tbody>
                                                    <tr style="height: 86px;">
                                                        <td class="k-scheduler-cell"></td>
                                                        <td class="k-scheduler-cell"></td>
                                                        <td class="k-scheduler-cell"></td>
                                                        <td class="k-scheduler-cell"></td>
                                                        <td class="k-scheduler-cell"></td>
                                                        <td class="k-scheduler-cell"></td>
                                                        <td class="k-scheduler-cell"></td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                            <div class="k-event k-event-all-day" role="button" aria-label="Event" style="top: 0px; left: 0%; width: 260px; height: 25px;">
                                                <span class="k-event-continuation">
                                                    <span class="k-icon k-svg-icon k-svg-i-chevron-left" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                                            <path d="m353.941 382.059-126.06-126.06 126.06-126.061L320 96 160 255.999 320 416z"></path>
                                                        </svg>
                                                    </span>
                                                </span>
                                                <div>
                                                    <div class="k-event-template k-event-title">From Last Week Event</div>
                                                    <span class="k-event-all-day-time">9:00 AM</span>
                                                </div>
                                                <span class="k-resize-handle k-resize-w"></span>
                                                <span class="k-resize-handle k-resize-e"></span>
                                            </div>
                                            <div class="k-event" role="button" aria-label="Event" style="top: 0px; left: 57.143%; width: 130px; height: 25px;">
                                                <div>
                                                    <div class="k-event-template k-event-title">All Day Event</div>
                                                </div>
                                                <span class="k-resize-handle k-resize-w"></span>
                                                <span class="k-resize-handle k-resize-e"></span>
                                            </div>
                                            <div class="k-event k-event-all-day" role="button" aria-label="Event" style="top: 28px; left: 14.286%; width: 260px; height: 25px;">
                                                <div>
                                                    <span class="k-event-all-day-time">8:00 AM</span>
                                                    <div class="k-event-template k-event-title">Multi Day Event Long Event</div>
                                                    <span class="k-event-all-day-time">5:00 PM</span>
                                                </div>
                                                <span class="k-resize-handle k-resize-w"></span>
                                                <span class="k-resize-handle k-resize-e"></span>
                                            </div>
                                            <div class="k-event k-event-all-day" role="button" aria-label="Event" style="top: 28px; left: 57%; width: 43%; height: 25px;">
                                                <div>
                                                    <span class="k-event-all-day-time">9:00 AM</span>
                                                    <div class="k-event-template k-event-title">To Next Week Event</div>
                                                </div>
                                                <span class="k-event-continuation">
                                                    <span class="k-icon k-svg-icon k-svg-i-chevron-right" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                                            <path d="m158.059 129.941 126.06 126.06-126.06 126.061L192 416l160-159.999L192 96z"></path>
                                                        </svg>
                                                    </span>
                                                </span>
                                                <span class="k-resize-handle k-resize-w"></span>
                                                <span class="k-resize-handle k-resize-e"></span>
                                            </div>
                                            <div class="k-event" role="button" aria-label="Event" style="top: 56px; left: 0%; width: 100%; height: 25px;">
                                                <span class="k-event-continuation">
                                                    <span class="k-icon k-svg-icon k-svg-i-chevron-left" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                                            <path d="m353.941 382.059-126.06-126.06 126.06-126.061L320 96 160 255.999 320 416z"></path>
                                                        </svg>
                                                    </span>
                                                </span>
                                                <div>
                                                    <div class="k-event-template k-event-title">Multi Week Event</div>
                                                </div>
                                                <span class="k-event-continuation">
                                                    <span class="k-icon k-svg-icon k-svg-i-chevron-right" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                                            <path d="m158.059 129.941 126.06 126.06-126.06 126.061L192 416l160-159.999L192 96z"></path>
                                                        </svg>
                                                    </span>
                                                </span>
                                                <span class="k-resize-handle k-resize-w"></span>
                                                <span class="k-resize-handle k-resize-e"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr class="k-scheduler-body">
                            <td>
                                <div class="k-scheduler-times" style="height: 195px;">
                                    <table role="none" class="k-scheduler-table" style="height: 400px;">
                                        <tbody>
                                            <tr>
                                                <th class="k-scheduler-cell">
                                                    <span>7:00 AM</span>
                                                </th>
                                            </tr>
                                            <tr>
                                                <th role="presentation" class="k-scheduler-cell k-slot-cell"></th>
                                            </tr>
                                            <tr>
                                                <th class="k-scheduler-cell">
                                                    <span>8:00 AM</span>
                                                </th>
                                            </tr>
                                            <tr>
                                                <th role="presentation" class="k-scheduler-cell k-slot-cell"></th>
                                            </tr>
                                            <tr>
                                                <th class="k-scheduler-cell">
                                                    <span>9:00 AM</span>
                                                </th>
                                            </tr>
                                            <tr>
                                                <th role="presentation" class="k-scheduler-cell k-slot-cell"></th>
                                            </tr>
                                            <tr>
                                                <th class="k-scheduler-cell">
                                                    <span>10:00 AM</span>
                                                </th>
                                            </tr>
                                            <tr>
                                                <th role="presentation" class="k-scheduler-cell k-slot-cell"></th>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </td>
                            <td>
                                <div tabindex="0" class="k-scheduler-content" style="height: 195px;">
                                    <table class="k-scheduler-table">
                                        <tbody>
                                            <tr class="k-middle-row">
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                            </tr>
                                            <tr>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                            </tr>
                                            <tr class="k-middle-row">
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                            </tr>
                                            <tr>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                                <td class="k-scheduler-cell">&nbsp;</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="k-scheduler-footer k-toolbar" aria-label="Toolbar" role="toolbar">
                    <button class="k-toolbar-button k-scheduler-fullday k-button">
                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-clock" aria-hidden="true">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                                <path d="M256 128h-32v160h160v-32H256zm0-96C132.3 32 32 132.3 32 256s100.3 224 224 224 224-100.3 224-224S379.7 32 256 32m0 416c-105.9 0-192-86.1-192-192S150.1 64 256 64s192 86.1 192 192-86.1 192-192 192"></path>
                            </svg>
                        </span>
                        <span class="k-button-text">Show business hours</span>
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
