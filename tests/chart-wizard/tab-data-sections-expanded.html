<!doctype html>

    <body id="app" class="k-body">
        <style>
            #test-area {
            max-width: 1040px;

        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <section>
                <span class="k-font-bold">Configuration section expanded</span>
                <div class="k-expander k-expanded">

                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15 12 7.5l7.5 7.5" fill="none"></path>
                                </svg>
                            </span>
                        </span>
                    </div>
                    <div class="k-expander-content-wrapper" id="k-expander-content-1">

                                    <legend class="k-form-legend">X axis (category)</legend>

                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                                </svg>
                                            </span>
                                        </button>
                                    </span>

                                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5M3.75 9h16.5m-16.5 6h16.5" fill="none"></path>

                                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5M3.75 9h16.5m-16.5 6h16.5" fill="none"></path>

                                                                    </span>
                                                                </td>
