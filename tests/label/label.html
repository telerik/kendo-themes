<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            #test-area {

        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <span>Label</span>
            <span>Label RTL</span>
            <div>
                <label class="k-label">Label</label>
            </div>
            <div dir="rtl">
                <label class="k-label">Label</label>
            </div>
            <div>

            </div>
            <div dir="rtl">

                    <span class="k-label-optional">(Optional)</span>
                </label>

            <div class="label-field">

                    <span class="k-label-optional">(Optional)</span>
                </label>
                <span class="k-textbox k-input">
                    <input class="k-input-inner" placeholder="Placeholder" autocomplete="off" type="text" value="">

            </div>
            <div class="label-field" dir="rtl">
                <label class="k-label">
                    Label
                    <span class="k-label-optional">(Optional)</span>
                </label>
