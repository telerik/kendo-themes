<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">

        <title>Document</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            section {
            padding: 20px;
            border: 1px dashed gray;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <span>Vertical Form</span>
            <span>Horizontal Form</span>
            <section>
                <form class="k-form">
                    <div class="k-form-field">
                        <label class="k-form-label k-label">AutoComplete:</label>
                        <div class="k-form-field-wrap">
                            <span class="k-autocomplete k-input">
                                <input role="combobox" aria-haspopup="listbox" aria-expanded="false" class="k-input-inner" placeholder="Autocomplete..." autocomplete="off" type="text" value="">
                            </span>
                        </div>
                    </div>
                    <div class="k-form-field">
                        <label class="k-form-label k-label">ComboBox:</label>
                        <div class="k-form-field-wrap">
                            <span class="k-combobox k-input">
                                <input role="combobox" aria-haspopup="listbox" aria-expanded="false" class="k-input-inner" placeholder="Combobox..." autocomplete="off" type="text" value="">
                                <button class="k-input-button k-button k-icon-button" aria-label="Open popup" tabindex="-1">
                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                </button>
                            </span>
                        </div>
                    </div>
                    <div class="k-form-field">
                        <label class="k-form-label k-label">DropDownList:</label>
                        <div class="k-form-field-wrap">
                            <span class="k-dropdownlist k-picker" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0">
                                <span class="k-input-inner">DropdownList...</span>
                                <button class="k-input-button k-button k-icon-button" aria-label="DropdownList..." tabindex="-1">
                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                </button>
                            </span>
                        </div>
                    </div>
                    <div class="k-form-field">
                        <label class="k-form-label k-label">MultiSelect:</label>
                        <div class="k-form-field-wrap">
                            <span class="k-multiselect k-input">
                                <div class="k-input-values">
                                    <div class="k-chip-list" role="listbox" aria-label="chip list" aria-orientation="horizontal">
                                        <div class="k-chip" role="button" aria-pressed="false">
                                            <span class="k-chip-content">
                                                <span class="k-chip-label">Female</span>
                                            </span>
                                            <span class="k-chip-actions">
                                                <span class="k-chip-action k-chip-remove-action">
                                                    <span class="k-icon k-svg-icon k-icon-sm k-svg-i-x-circle" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="m15 9-6 6m0-6 6 6m6-3c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                        </svg>
                                                    </span>
                                                </span>
                                            </span>
                                        </div>
                                    </div>
                                    <input role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-autocomplete="list" class="k-input-inner" placeholder="" autocomplete="off" type="text" value="">
                                </div>
                                <span class="k-clear-value">
                                    <span class="k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                </span>
                            </span>
                        </div>
                    </div>
                </form>
            </section>

                                                        </svg>
                                                    </span>
                                                </span>
                                            </span>
                                        </div>
                                    </div>
                                    <input role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-autocomplete="list" class="k-input-inner" placeholder="" autocomplete="off" type="text" value="">

                                        </svg>
                                    </span>
                                </span>
                            </span>

                    </div>
                </form>
            </section>
        </div>
    </body>
