<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            #test-area .k-pdf-viewer {
            height: 600px;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-1">
            <div class="k-pdf-viewer">

                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-to-left" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 19.5 10.5 12 18 4.5m-11.25 0v15" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>

                                    </svg>
                                </span>
                            </button>
                            <span class="k-pager-input">
                                <span>Page</span>
                                <span class="k-numerictextbox k-input">
                                    <input role="spinbutton" aria-label="Current page" class="k-input-inner" placeholder="" autocomplete="off" type="text" value="1">
                                </span>
                                <span>of 6</span>
                            </span>
                            <button class="k-pager-nav k-button k-button-flat k-icon-button" title="Go to the next page" aria-label="Go to the next page">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-right" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m6 4.5 7.5 7.5L6 19.5m11.25-15v15" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                    </svg>
                                </span>
                            </button>

                    </div>
                    <span class="k-spacer"></span>

                            </span>

                                </svg>
                            </span>
                        </button>
                    </div>

                        <span class="k-clear-value">
                            <span class="k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>

                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                </svg>
                            </span>
                        </button>
                    </span>

                                </svg>
                            </span>
                        </button>
                        <button class="k-group-end k-button k-button-flat k-icon-button">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-hand" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.7496 7.125a1.8752 1.8752 0 0 1 3.2009-1.3258 1.875 1.875 0 0 1 .5491 1.3258v7.125a7.5 7.5 0 0 1-.5709 2.8701 7.5002 7.5002 0 0 1-6.9291 4.6299c-4.1418 0-5.6953-1.995-8.7487-8.4375a1.875 1.875 0 0 1 3.2475-1.875L8.2496 14.25V5.625a1.875 1.875 0 0 1 3.75 0m-.0001 5.625V4.125a1.875 1.875 0 0 1 1.875-1.875 1.875 1.875 0 0 1 1.875 1.875v7.125" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                    <span class="k-spacer"></span>
                    <button class="k-toolbar-button  k-button k-button-flat k-icon-button">

                            </svg>
                        </span>
                    </button>
                    <button class="k-toolbar-button  k-button k-button-flat k-icon-button">

                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 13.5V3M8.25 9.75 12 13.5l3.75-3.75m4.5 3.75v6H3.75v-6" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                            </svg>
                        </span>
                    </button>
                    <button class="k-toolbar-button  k-button k-button-flat k-icon-button">
                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-print" aria-hidden="true">

                </div>

                    <div class="k-pdf-viewer-pages">
                        <div class="k-page" style="width: 720px; height: 360px;"></div>
                        <div class="k-page" style="width: 720px; height: 360px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
