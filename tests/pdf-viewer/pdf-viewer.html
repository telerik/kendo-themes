<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            #test-area .k-pdf-viewer {
            height: 600px;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-1">
            <div class="k-pdf-viewer">
                <div class="k-toolbar k-toolbar-flat k-toolbar-resizable" role="toolbar" aria-label="Toolbar">
                    <button class="k-toolbar-menu-button  k-menu-button k-button k-button-flat k-icon-button" aria-label="Menu" aria-expanded="false">
                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-menu" aria-hidden="true">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5M3.75 6h16.5M3.75 18h16.5" fill="none"></path>
                            </svg>
                        </span>
                    </button>
                    <div class="k-toolbar-separator k-separator"></div>
                    <div class="k-pager" role="application" aria-roledescription="pager" aria-keyshortcuts="Enter ArrowRight ArrowLeft" aria-label="Page 1 of 6">
                        <div class="k-pager-numbers-wrap">
                            <button class="k-pager-nav k-pager-first k-button k-button-flat k-disabled k-icon-button" title="Go to the first page" aria-label="Go to the first page" aria-disabled="true">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-to-left" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 19.5 10.5 12 18 4.5m-11.25 0v15" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-pager-nav k-button k-button-flat k-disabled k-icon-button" title="Go to the previous page" aria-label="Go to the previous page" aria-disabled="true">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-left" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.5 7.5 12 15 4.5" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                            <span class="k-pager-input">
                                <span>Page</span>
                                <span class="k-numerictextbox k-input">
                                    <input role="spinbutton" aria-label="Current page" class="k-input-inner" placeholder="" autocomplete="off" type="text" value="1">
                                </span>
                                <span>of 6</span>
                            </span>
                            <button class="k-pager-nav k-button k-button-flat k-icon-button" title="Go to the next page" aria-label="Go to the next page">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-right" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m9 4.5 7.5 7.5L9 19.5" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-pager-nav k-pager-last k-button k-button-flat k-icon-button" title="Go to the last page" aria-label="Go to the last page">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-to-right" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m6 4.5 7.5 7.5L6 19.5m11.25-15v15" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <span class="k-spacer"></span>
                    <div role="group" class="k-toolbar-button-group  k-button-group k-button-group-flat">
                        <button class="k-group-start k-button k-button-flat k-icon-button" aria-label="Zoom out">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-zoom-out" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 10.5h6m2.3032 5.3037 5.1966 5.1966M18 10.5c0 4.1421-3.3579 7.5-7.5 7.5S3 14.6421 3 10.5 6.3579 3 10.5 3 18 6.3579 18 10.5" fill="none"></path>
                                </svg>
                            </span>
                        </button>
                        <button class="k-group-end k-button k-button-flat k-icon-button" aria-label="Zoom in">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-zoom-in" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 10.5h6m2.3032 5.3037 5.1966 5.1966M10.5 7.5v6m7.5-3c0 4.1421-3.3579 7.5-7.5 7.5S3 14.6421 3 10.5 6.3579 3 10.5 3 18 6.3579 18 10.5" fill="none"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                    <span class="k-toolbar-combobox  k-combobox k-input k-input-flat">
                        <input role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-label="Zoom level" class="k-input-inner" placeholder="" autocomplete="off" type="text" value="Automatic Width">
                        <span class="k-clear-value">
                            <span class="k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none"></path>
                                </svg>
                            </span>
                        </span>
                        <button class="k-input-button k-button k-button-flat k-icon-button" aria-label="Open popup" tabindex="-1">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                </svg>
                            </span>
                        </button>
                    </span>
                    <div role="group" class="k-toolbar-button-group  k-button-group k-button-group-flat">
                        <button class="k-group-start k-button k-button-flat k-icon-button" aria-label="Selection tool">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-pointer" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.2201 12.9709a.75.75 0 0 1-.2072-.6704.75.75 0 0 1 .4378-.5483l4.3509-1.6706a.7498.7498 0 0 0 .2897-1.1331.75.75 0 0 0-.3562-.2591L4.7285 3.789a.75.75 0 0 0-.9375.9375l4.8975 15.0093a.751.751 0 0 0 .6735.5056.7503.7503 0 0 0 .7187-.439l1.6706-4.3509a.75.75 0 0 1 .5484-.4379.75.75 0 0 1 .6704.2072l4.8103 4.8104a.75.75 0 0 0 1.0603 0l1.1897-1.1869a.7503.7503 0 0 0 0-1.0603z" fill="none"></path>
                                </svg>
                            </span>
                        </button>
                        <button class="k-group-end k-button k-button-flat k-icon-button" aria-label="Hand tool">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-hand" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.7496 7.125a1.8752 1.8752 0 0 1 3.2009-1.3258 1.875 1.875 0 0 1 .5491 1.3258v7.125a7.5 7.5 0 0 1-.5709 2.8701 7.5002 7.5002 0 0 1-6.9291 4.6299c-4.1418 0-5.6953-1.995-8.7487-8.4375a1.875 1.875 0 0 1 3.2475-1.875L8.2496 14.25V5.625a1.875 1.875 0 0 1 3.75 0m-.0001 5.625V4.125a1.875 1.875 0 0 1 1.875-1.875 1.875 1.875 0 0 1 1.875 1.875v7.125" fill="none"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                    <span class="k-spacer"></span>
                    <button class="k-toolbar-button  k-button k-button-flat k-icon-button" aria-haspopup="dialog" aria-label="Search">
                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-search" aria-hidden="true">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m15.8032 15.8037 5.1966 5.1966M18 10.5c0 4.1421-3.3579 7.5-7.5 7.5S3 14.6421 3 10.5 6.3579 3 10.5 3 18 6.3579 18 10.5" fill="none"></path>
                            </svg>
                        </span>
                    </button>
                    <button class="k-toolbar-button  k-button k-button-flat k-icon-button" aria-label="Annotations">
                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-edit-annotations" aria-hidden="true">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 5.25 3 3m1.5 3.75v7.5a.7497.7497 0 0 1-.75.75h-15a.75.75 0 0 1-.75-.75v-15a.75.75 0 0 1 .75-.75H12M12 15H9v-3l9-9 3 3z" fill="none"></path>
                            </svg>
                        </span>
                    </button>
                    <button class="k-toolbar-button  k-button k-button-flat k-icon-button" aria-label="Comments">
                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-comment" aria-hidden="true">
                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 10.5h6m-6 3h6M4.2328 21.5728a.75.75 0 0 1-.7988.1062A.75.75 0 0 1 3 21V6a.75.75 0 0 1 .75-.75h16.5A.75.75 0 0 1 21 6v12a.7497.7497 0 0 1-.75.75H7.5z" fill="none"></path>
                            </svg>
                        </span>
                    </button>
                </div>
                <div class="k-canvas k-pdf-viewer-canvas k-pos-relative k-overflow-auto k-enable-text-select" tabindex="0" aria-label="PDF document" role="document">
                    <div class="k-pdf-viewer-pages">
                        <div class="k-page" style="width: 720px; height: 360px;"></div>
                        <div class="k-page" style="width: 720px; height: 360px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
