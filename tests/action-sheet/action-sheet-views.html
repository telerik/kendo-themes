<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">

        <link rel="stylesheet" href="/packages/html/assets/styles.css">

    <body id="app" class="k-body">
        <style>
            #test-area {
            max-width: 1060px;
            --kendo-actionsheet-height: 400px;
            --kendo-actionsheet-max-height: 400px;
            }
            #test-area > section {
            height: 600px;
            outline: 1px dotted;
            overflow: hidden;
            position: relative;
            transform: translateZ(0);
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <span class="k-col-span-2">ActionSheet With Multiple Views</span>
            <section>
                <div class="k-actionsheet-container">
                    <div class="k-overlay"></div>
                    <div class="k-animation-container k-animation-container-shown">
                        <div class="k-child-animation-container" style="bottom: 0px; width: 100%;">
                            <div id="actionsheet-views-1" role="dialog" aria-modal="true" class="k-actionsheet k-actionsheet-bottom k-adaptive-actionsheet" style="--kendo-actionsheet-view-current: 1;">
                                <div class="k-actionsheet-view k-actionsheet-view-animated">
                                    <div class="k-actionsheet-titlebar">
                                        <div class="k-actionsheet-titlebar-group">
                                            <div class="k-actionsheet-title">
                                                <div class="k-text-center">View 1</div>
                                            </div>
                                            <div class="k-actionsheet-actions">
                                                <button class="k-button k-button-lg k-button-flat k-icon-button" aria-label="Close">
                                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none"></path>
                                                        </svg>
                                                    </span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actionsheet-content">
                                        <div class="k-column-menu k-column-menu-lg">
                                            <div class="k-columnmenu-item-wrapper">
                                                <div class="k-expander">
                                                    <div aria-expanded="false" aria-controls="k-columnmenu-content-1" class="k-columnmenu-item" role="button" tabindex="0">
                                                        Go to View 2
                                                        <span class="k-spacer"></span>
                                                        <span class="k-expander-indicator">
                                                            <span class="k-icon k-svg-icon k-svg-i-chevron-right" aria-hidden="true">
                                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                                    <path stroke-linecap="round" stroke-linejoin="round" d="m9 4.5 7.5 7.5L9 19.5" fill="none"></path>
                                                                </svg>
                                                            </span>
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="k-actionsheet-view k-actionsheet-view-animated">
                                    <div class="k-actionsheet-titlebar">
                                        <div class="k-actionsheet-titlebar-group">
                                            <div class="k-actionsheet-actions">
                                                <button class="k-button k-button-lg k-button-flat k-icon-button" aria-label="Back">
                                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-left" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.5 7.5 12 15 4.5" fill="none"></path>
                                                        </svg>
                                                    </span>
                                                </button>
                                            </div>
                                            <div class="k-actionsheet-title">

                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none"></path>
                                                        </svg>
                                                    </span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actionsheet-content">
                                        <div class="k-column-menu k-column-menu-lg">
                                            <div class="k-columnmenu-item-wrapper">
                                                <div class="k-columnmenu-item" role="button" tabindex="0">Item</div>

                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actions k-actions-stretched k-actions-horizontal k-actionsheet-footer">
                                        <button class="k-button k-button-lg">
                                            <span class="k-button-text">Button</span>
                                        </button>
                                        <button class="k-button k-button-lg k-button-primary">
                                            <span class="k-button-text">Button</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section>

                    <div class="k-overlay"></div>
                    <div class="k-animation-container k-animation-container-shown">

                                            <div class="k-actionsheet-actions">
                                                <button class="k-button k-button-lg k-button-flat k-icon-button" aria-label="Back">
                                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-left" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.5 7.5 12 15 4.5" fill="none"></path>
                                                        </svg>
                                                    </span>
                                                </button>
                                            </div>
                                            <div class="k-actionsheet-title">
                                                <div class="k-text-center">View 2</div>
                                            </div>
                                            <div class="k-actionsheet-actions">
                                                <button class="k-button k-button-lg k-button-flat k-icon-button" aria-label="Close">
                                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-x" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 5.25-13.5 13.5m13.5 0L5.25 5.25" fill="none"></path>
                                                        </svg>
                                                    </span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actionsheet-content">
                                        <div class="k-column-menu k-column-menu-lg">
                                            <div class="k-columnmenu-item-wrapper">
                                                <div class="k-columnmenu-item" role="button" tabindex="0">Item</div>
                                                <div class="k-columnmenu-item" role="button" tabindex="0">Item</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actions k-actions-stretched k-actions-horizontal k-actionsheet-footer">
                                        <button class="k-button k-button-lg">
                                            <span class="k-button-text">Button</span>

                                        <button class="k-button k-button-lg k-button-primary">
