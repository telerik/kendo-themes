<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            #test-area {
            --kendo-actionsheet-height: 511px;
            --kendo-actionsheet-max-height: 511px;
            }
            #test-area > section {
            height: 520px;
            outline: 1px dotted;
            overflow: hidden;
            position: relative;
            transform: translateZ(0);
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <span>Loading (title/subtitle + content skeleton)</span>
            <span>Loading (header actions + content + footer skeleton)</span>
            <section>
                <div class="k-actionsheet-container">
                    <div class="k-overlay"></div>
                    <div class="k-animation-container k-animation-container-shown">
                        <div class="k-child-animation-container" style="bottom: 0px; width: 100%;">
                            <div id="actionsheet-loading-1" role="dialog" aria-modal="true" aria-labelledby="actionsheet-loading-1-title" class="k-actionsheet k-actionsheet-bottom">
                                <div id="actionsheet-loading-1" class="k-actionsheet-view">
                                    <div class="k-actionsheet-view-body">
                                        <div class="k-actionsheet-titlebar">
                                            <div class="k-actionsheet-titlebar-group">
                                                <div class="k-actionsheet-title" id="actionsheet-loading-1-title">
                                                    <div style="display: flex; flex-flow: column; gap: var( --kendo-spacing-2 );">
                                                        <span class="k-skeleton k-skeleton-text k-skeleton-pulse" style="width: 100%; height: 22px;"></span>
                                                        <span class="k-skeleton k-skeleton-text k-skeleton-pulse" style="width: 100%; height: 20px;"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="k-actionsheet-content">
                                            <div class="k-skeleton-container" style="display: flex; flex-flow: column; gap: var( --kendo-spacing-2 ); padding: var( --kendo-spacing-2 );">
                                                <div style="display: flex; flex-flow: column; gap: var( --kendo-spacing-2 );">
                                                    <span class="k-skeleton k-skeleton-text k-skeleton-pulse" style="width: 100%; height: 20px;"></span>
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 100%; height: 32px;"></span>
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 100%; height: 32px;"></span>
                                                </div>
                                                <hr class="k-hr">
                                                <div style="display: flex; flex-flow: column; gap: var( --kendo-spacing-2 );">
                                                    <span class="k-skeleton k-skeleton-text k-skeleton-pulse" style="width: 100%; height: 20px;"></span>
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 100%; height: 32px;"></span>
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 100%; height: 32px;"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section>
                <div class="k-actionsheet-container">
                    <div class="k-overlay"></div>
                    <div class="k-animation-container k-animation-container-shown">
                        <div class="k-child-animation-container" style="bottom: 0px; width: 100%;">
                            <div id="actionsheet-loading-2" role="dialog" aria-modal="true" aria-labelledby="actionsheet-loading-2-title" class="k-actionsheet k-actionsheet-bottom">
                                <div id="actionsheet-loading-2" class="k-actionsheet-view">
                                    <div class="k-actionsheet-view-body">
                                        <div class="k-actionsheet-titlebar">
                                            <div class="k-actionsheet-titlebar-group">
                                                <div class="k-actionsheet-actions">
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 24px; height: 24px;"></span>
                                                </div>
                                                <div class="k-actionsheet-title" id="actionsheet-loading-2-title">
                                                    <div style="display: flex; flex-flow: column; gap: var( --kendo-spacing-2 );">
                                                        <span class="k-skeleton k-skeleton-text k-skeleton-pulse" style="width: 100%; height: 22px;"></span>
                                                        <span class="k-skeleton k-skeleton-text k-skeleton-pulse" style="width: 100%; height: 20px;"></span>
                                                    </div>
                                                </div>
                                                <div class="k-actionsheet-actions">
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 24px; height: 24px;"></span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="k-actionsheet-content">
                                            <div class="k-skeleton-container" style="display: flex; flex-flow: column; gap: var( --kendo-spacing-2 ); padding: var( --kendo-spacing-2 );">
                                                <div style="display: flex; flex-flow: column; gap: var( --kendo-spacing-2 );">
                                                    <span class="k-skeleton k-skeleton-text k-skeleton-pulse" style="width: 100%; height: 20px;"></span>
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 100%; height: 32px;"></span>
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 100%; height: 32px;"></span>
                                                </div>
                                                <hr class="k-hr">
                                                <div style="display: flex; flex-flow: column; gap: var( --kendo-spacing-2 );">
                                                    <span class="k-skeleton k-skeleton-text k-skeleton-pulse" style="width: 100%; height: 20px;"></span>
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 100%; height: 32px;"></span>
                                                    <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="width: 100%; height: 32px;"></span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="k-actions k-actions-stretched k-actions-horizontal k-actionsheet-footer">
                                            <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="flex: 1 1 0px; height: 38px;"></span>
                                            <span class="k-skeleton k-skeleton-rect k-skeleton-pulse" style="flex: 1 1 0px; height: 38px;"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
