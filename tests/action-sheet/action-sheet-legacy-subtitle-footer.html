<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            #test-area {
            --kendo-actionsheet-height: 500px;
            --kendo-actionsheet-max-height: 500px;
            }
            #test-area > section {
            height: 600px;
            outline: 1px dotted;
            overflow: hidden;
            position: relative;
            transform: translateZ(0);
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <span>partial</span>
            <span>full screen</span>
            <section>
                <div class="k-actionsheet-container">
                    <div class="k-overlay"></div>
                    <div class="k-animation-container k-animation-container-shown">
                        <div class="k-child-animation-container" style="bottom: 0px; width: 100%;">
                            <div id="actionsheet-legacy-subtitle-footer-1" role="dialog" aria-modal="true" aria-labelledby="actionsheet-legacy-subtitle-footer-1-title" class="k-actionsheet k-actionsheet-bottom k-adaptive-actionsheet">
                                <div class="k-actionsheet-view">
                                    <div class="k-actionsheet-titlebar">
                                        <div class="k-actionsheet-titlebar-group">
                                            <div class="k-actionsheet-title" id="actionsheet-legacy-subtitle-footer-1-title">
                                                <div class="k-text-center">Label</div>
                                                <div class="k-actionsheet-subtitle k-text-center">Subtitle</div>
                                            </div>
                                            <div class="k-actionsheet-actions">
                                                <button class="k-button k-button-lg k-button-flat k-button-primary k-icon-button" aria-label="Apply selection">
                                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-check" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5 9 18.75l12-12" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                        </svg>
                                                    </span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actionsheet-content">
                                        <div class="k-list-container">
                                            <div class="k-list k-list-lg">
                                                <div class="k-list-content">
                                                    <ul aria-label="Options" role="listbox" class="k-list-ul">
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">List item</span>
                                                        </li>
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">List item</span>
                                                        </li>
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">List item</span>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actions k-actions-stretched k-actions-horizontal k-actionsheet-footer">
                                        <button class="k-button k-button-lg">
                                            <span class="k-button-text">Cancel</span>
                                        </button>
                                        <button class="k-button k-button-lg k-button-primary">
                                            <span class="k-button-text">Apply</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section>
                <div class="k-actionsheet-container">
                    <div class="k-overlay"></div>
                    <div class="k-animation-container k-animation-container-shown">
                        <div class="k-child-animation-container" style="top: 0px; width: 100%; height: 100%;">
                            <div id="actionsheet-legacy-subtitle-footer-2" role="dialog" aria-modal="true" aria-labelledby="actionsheet-legacy-subtitle-footer-2-title" class="k-actionsheet k-actionsheet-fullscreen k-adaptive-actionsheet">
                                <div class="k-actionsheet-view">
                                    <div class="k-actionsheet-titlebar">
                                        <div class="k-actionsheet-titlebar-group">
                                            <div class="k-actionsheet-title" id="actionsheet-legacy-subtitle-footer-2-title">
                                                <div class="k-text-center">Label</div>
                                                <div class="k-actionsheet-subtitle k-text-center">Subtitle</div>
                                            </div>
                                            <div class="k-actionsheet-actions">
                                                <button class="k-button k-button-lg k-button-flat k-button-primary k-icon-button" aria-label="Apply selection">
                                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-check" aria-hidden="true">
                                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5 9 18.75l12-12" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                        </svg>
                                                    </span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actionsheet-content">
                                        <div class="k-list-container">
                                            <div class="k-list k-list-lg">
                                                <div class="k-list-content">
                                                    <ul aria-label="Options" role="listbox" class="k-list-ul">
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">List item</span>
                                                        </li>
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">List item</span>
                                                        </li>
                                                        <li role="option" tabindex="-1" aria-selected="false" class="k-list-item">
                                                            <span class="k-list-item-text">List item</span>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="k-actions k-actions-stretched k-actions-horizontal k-actionsheet-footer">
                                        <button class="k-button k-button-lg">
                                            <span class="k-button-text">Cancel</span>
                                        </button>
                                        <button class="k-button k-button-lg k-button-primary">
                                            <span class="k-button-text">Apply</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
