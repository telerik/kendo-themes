<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <div id="test-area">
            <span>Grid - cell rowspan</span>
            <section>
                <div class="k-grid">
                    <div class="k-grid-aria-root" role="grid" id="k-grid-1" aria-colcount="4" aria-rowcount="8">
                        <div class="k-grid-header">
                            <div class="k-grid-header-wrap">
                                <table class="k-grid-header-table k-table">
                                    <colgroup>
                                        <col style="width: 100px;">
                                        <col>
                                        <col>
                                        <col>
                                    </colgroup>
                                    <thead class="k-table-thead">
                                        <tr class="k-table-row">
                                            <th class="k-header k-table-th">
                                                <span class="k-cell-inner">
                                                    <span class="k-link">
                                                        <span class="k-column-title">Column 1</span>
                                                    </span>
                                                </span>
                                            </th>
                                            <th class="k-header k-table-th">
                                                <span class="k-cell-inner">
                                                    <span class="k-link">
                                                        <span class="k-column-title">Column 2</span>
                                                    </span>
                                                </span>
                                            </th>
                                            <th class="k-header k-table-th">
                                                <span class="k-cell-inner">
                                                    <span class="k-link">
                                                        <span class="k-column-title">Column 3</span>
                                                    </span>
                                                </span>
                                            </th>
                                            <th class="k-header k-table-th">
                                                <span class="k-cell-inner">
                                                    <span class="k-link">
                                                        <span class="k-column-title">Column 4</span>
                                                    </span>
                                                </span>
                                            </th>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>
                        <div class="k-grid-container">
                            <div class="k-grid-content">
                                <table class="k-grid-table k-table">
                                    <colgroup>
                                        <col style="width: 100px;">
                                        <col>
                                        <col>
                                        <col>
                                    </colgroup>
                                    <tbody class="k-table-tbody">
                                        <tr class="k-master-row k-table-row">
                                            <td class="k-table-td">1</td>
                                            <td class="k-table-td">Row</td>
                                            <td rowspan="3" class="k-table-td-row-span k-table-td">Row span 3</td>
                                            <td class="k-table-td">No-spanned cell</td>
                                        </tr>
                                        <tr class="k-master-row k-table-row k-table-alt-row">
                                            <td class="k-table-td">2</td>
                                            <td rowspan="4" class="k-table-td-row-span k-table-td">Row span 4</td>
                                            <td class="k-table-td">No-spanned cell</td>
                                        </tr>
                                        <tr class="k-master-row k-table-row">
                                            <td class="k-table-td">3</td>
                                            <td class="k-table-td">No-spanned cell</td>
                                        </tr>
                                        <tr class="k-master-row k-table-row k-table-alt-row">
                                            <td class="k-table-td">4</td>
                                            <td class="k-table-td">No-spanned cell</td>
                                            <td rowspan="3" class="k-table-td-row-span k-focus k-table-td">Row span 3 + Focus</td>
                                        </tr>
                                        <tr class="k-master-row k-table-row">
                                            <td class="k-table-td">5</td>
                                            <td class="k-table-td">No-spanned cell</td>
                                        </tr>
                                        <tr class="k-master-row k-table-row k-table-alt-row">
                                            <td class="k-table-td">6</td>
                                            <td class="k-table-td">No-spanned cell</td>
                                            <td class="k-table-td">No-spanned cell</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="k-grid-pager k-pager k-pager-responsive" role="application" aria-roledescription="pager" aria-keyshortcuts="Enter ArrowRight ArrowLeft" aria-label="Page 1 of 6">
                        <div class="k-pager-numbers-wrap">
                            <button class="k-pager-nav k-pager-first k-button k-button-flat k-disabled k-icon-button" title="Go to the first page" aria-label="Go to the first page" aria-disabled="true">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-to-left" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 19.5 10.5 12 18 4.5m-11.25 0v15" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-pager-nav k-button k-button-flat k-disabled k-icon-button" title="Go to the previous page" aria-label="Go to the previous page" aria-disabled="true">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-left" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.5 7.5 12 15 4.5" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                            <div class="k-pager-numbers">
                                <button class="k-button k-button-flat k-button-primary k-selected" aria-label="Page 1" aria-current="page">
                                    <span class="k-button-text">1</span>
                                </button>
                                <button class="k-button k-button-flat k-button-primary" aria-label="Page 2">
                                    <span class="k-button-text">2</span>
                                </button>
                                <button class="k-button k-button-flat k-button-primary" aria-label="Page 3">
                                    <span class="k-button-text">3</span>
                                </button>
                                <button class="k-button k-button-flat k-button-primary" aria-label="Page 4">
                                    <span class="k-button-text">4</span>
                                </button>
                                <button class="k-button k-button-flat k-button-primary" aria-label="Page 5">
                                    <span class="k-button-text">5</span>
                                </button>
                                <button class="k-button k-button-flat k-button-primary" aria-label="Page 6">
                                    <span class="k-button-text">6</span>
                                </button>
                            </div>
                            <button class="k-pager-nav k-button k-button-flat k-icon-button" title="Go to the next page" aria-label="Go to the next page">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-right" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m9 4.5 7.5 7.5L9 19.5" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                            <button class="k-pager-nav k-pager-last k-button k-button-flat k-icon-button" title="Go to the last page" aria-label="Go to the last page">
                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-caret-alt-to-right" aria-hidden="true">
                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m6 4.5 7.5 7.5L6 19.5m11.25-15v15" fill="none"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                        <span class="k-pager-sizes">
                            <span class="k-dropdownlist k-picker" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-label="Items per page" tabindex="0">
                                <span class="k-input-inner">
                                    <span class="k-input-value-text">5</span>
                                </span>
                                <button class="k-input-button k-button k-icon-button" aria-label="Toggle dropdown" tabindex="-1">
                                    <span class="k-button-icon k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none"></path>
                                        </svg>
                                    </span>
                                </button>
                            </span>
                            <span>items per page</span>
                        </span>
                        <button class="k-pager-refresh k-button k-button-flat k-icon-button" title="Refresh" aria-label="Refresh">
                            <span class="k-button-icon k-icon k-svg-icon k-svg-i-arrow-rotate-cw" aria-hidden="true">
                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.7495 5.2505v4.5h-4.5m4.5 0-3.9159-3.5842a8.2502 8.2502 0 0 0-14.0827 5.7141 8.25 8.25 0 0 0 13.9111 6.12" fill="none"></path>
                                </svg>
                            </span>
                        </button>
                        <span class="k-pager-info">1 - 5 of 20 items</span>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
