<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <div id="test-area" class="k-d-grid">
            <h3>Single group - selected row</h3>
            <div class="k-grid-no-scrollbar k-grid">
                <div class="k-grouping-header">
                    <div class="k-chip-list" role="listbox" aria-label="chip list" aria-orientation="horizontal">
                        <div class="k-chip" role="button" aria-pressed="false">
                            <span class="k-chip-content">
                                <span class="k-chip-label">Name</span>
                            </span>
                            <span class="k-chip-actions">
                                <span class="k-chip-action k-chip-remove-action">
                                    <span class="k-icon k-svg-icon k-icon-sm k-svg-i-x-circle" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="m15 9-6 6m0-6 6 6m6-3c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                </span>
                            </span>
                        </div>
                    </div>
                    <div class="k-grouping-drop-container"></div>
                </div>
                <div class="k-grid-aria-root" role="grid">
                    <div class="k-grid-header k-grid-draggable-header">
                        <div class="k-grid-header-wrap">
                            <table class="k-grid-header-table k-table">
                                <colgroup>
                                    <col class="k-group-col">
                                    <col>
                                    <col>
                                    <col>
                                </colgroup>
                                <thead class="k-table-thead">
                                    <tr class="k-table-row">
                                        <th colspan="1" rowspan="1" class="k-group-cell k-header k-table-th">
                                            <span class="k-sr-only">Group</span>
                                        </th>
                                        <th colspan="1" class="k-header k-table-th">
                                            <span class="k-cell-inner">
                                                <span class="k-link">
                                                    <span class="k-column-title">ID</span>
                                                </span>
                                            </span>
                                        </th>
                                        <th colspan="1" class="k-header k-table-th">
                                            <span class="k-cell-inner">
                                                <span class="k-link">
                                                    <span class="k-column-title">Name</span>
                                                </span>
                                            </span>
                                        </th>
                                        <th colspan="1" class="k-header k-table-th">
                                            <span class="k-cell-inner">
                                                <span class="k-link">
                                                    <span class="k-column-title">Price</span>
                                                </span>
                                            </span>
                                        </th>
                                    </tr>
                                </thead>
                            </table>
                        </div>
                    </div>
                    <div class="k-grid-container">
                        <div class="k-grid-content">
                            <table class="k-grid-table k-table">
                                <colgroup>
                                    <col class="k-group-col">
                                    <col>
                                    <col>
                                    <col>
                                </colgroup>
                                <tbody class="k-table-tbody">
                                    <tr class="k-table-group-row k-grouping-row k-table-row">
                                        <td colspan="4" class="k-table-td">
                                            <div class="k-grouping-row-content">
                                                <span class="k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                    </svg>
                                                </span>
                                                <span class="k-grouping-row-text">Name: Chai</span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr class="k-master-row k-table-row k-selected">
                                        <td class="k-table-group-td k-group-cell k-table-td"></td>
                                        <td colspan="0" class="k-table-td">1</td>
                                        <td colspan="0" class="k-table-td">Chai</td>
                                        <td colspan="0" class="k-table-td">$18.00</td>
                                    </tr>
                                    <tr class="k-table-group-row k-grouping-row k-table-row">
                                        <td colspan="4" class="k-table-td">
                                            <div class="k-grouping-row-content">
                                                <span class="k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                    </svg>
                                                </span>
                                                <span class="k-grouping-row-text">Name: Chang</span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr class="k-master-row k-table-row k-table-alt-row">
                                        <td class="k-table-group-td k-group-cell k-table-td"></td>
                                        <td colspan="0" class="k-table-td">2</td>
                                        <td colspan="0" class="k-table-td">Chang</td>
                                        <td colspan="0" class="k-table-td">$19.00</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
