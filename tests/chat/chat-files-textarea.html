<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            #test-area {
            max-width: 1240px;
            }
            .k-chat {
            min-height: 500px;
            min-width: auto;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-2">
            <span>Files within the Text Area (already uploaded before submission)</span>
            <span></span>
            <section>
                <div class="k-chat">
                    <div class="k-message-list" role="log" aria-label="Message list" aria-live="polite">
                        <div class="k-message-list-content">
                            <div class="k-message-group k-message-group-receiver">
                                <div class="k-avatar">
                                    <span class="k-avatar-image">
                                        <img alt="Bruv" src="/packages/html/assets/avatar.jpg">
                                    </span>
                                </div>
                                <div class="k-message-group-content">
                                    <span class="k-message-author">Bruv</span>
                                    <div class="k-message">
                                        <div class="k-chat-bubble k-bubble" tabindex="0">
                                            <div class="k-bubble-content">
                                                <span class="k-chat-bubble-text">How can I help you?</span>
                                            </div>
                                        </div>
                                        <div class="k-message-info">
                                            <span class="k-message-status">Seen</span>
                                            <time class="k-message-time">Thu Feb 08 2018</time>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="k-message-box-wrapper">
                        <div class="k-input k-prompt-box k-prompt-box-multiline">
                            <div class="k-prompt-box-header">
                                <ul role="list" aria-label="Attached files" class="k-file-box-wrapper k-file-box-wrapper-scrollable-start">
                                    <div class="k-files-scroll" role="presentation">
                                        <li role="listitem" tabindex="0" aria-label="FileName.pdf 2MB" class="k-file-box">
                                            <span aria-hidden="true" class="k-icon k-svg-icon k-icon-xl k-svg-i-file-pdf">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.25h-3v5.25m2.25-2.25h-2.25M4.5 18H6a1.875 1.875 0 0 0 1.875-1.875A1.875 1.875 0 0 0 6 14.25H4.5v5.25m15-9V8.25L14.25 3h-9a.75.75 0 0 0-.75.75v6.75M14.25 3v5.25h5.25m-9 6v5.25H12a2.625 2.625 0 0 0 1.8562-.7688 2.6254 2.6254 0 0 0 0-3.7124A2.625 2.625 0 0 0 12 14.25z" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                            <div class="k-file-info">
                                                <span class="k-file-name">FileName.pdf</span>
                                                <span class="k-file-size">2MB</span>
                                            </div>
                                            <span class="k-button k-button-xs k-button-flat k-icon-button" aria-hidden="true">
                                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x-circle" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="m15 9-6 6m0-6 6 6m6-3c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                    </svg>
                                                </span>
                                            </span>
                                        </li>
                                        <li role="listitem" tabindex="0" aria-label="File with long name 5MB" class="k-file-box">
                                            <span aria-hidden="true" class="k-icon k-svg-icon k-icon-xl k-svg-i-file-psd">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5074 11.25V9l-5.25-5.25h-9a.75.75 0 0 0-.75.75v6.75m9.75-7.5V9h5.25m-9.614 9.9362c0 .7238.7829 1.3111 1.7481 1.3111.9653 0 1.7481-.5873 1.7481-1.3111 0-1.7481-3.399-1.0926-3.399-2.6222 0-.7238.6857-1.3111 1.6509-1.3111.7239 0 1.2909.3278 1.5296.8009M4.1272 18.75h1.5a1.8747 1.8747 0 0 0 1.875-1.875A1.875 1.875 0 0 0 5.6272 15h-1.5zm0 0v1.5m11.8456-.0152h1.3a2.6002 2.6002 0 0 0 1.8385-4.4385 2.6 2.6 0 0 0-1.8385-.7615h-1.3z" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                            <div class="k-file-info">
                                                <span class="k-file-name">File with long name</span>
                                                <span class="k-file-size">5MB</span>
                                            </div>
                                            <span class="k-button k-button-xs k-button-flat k-icon-button" aria-hidden="true">
                                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x-circle" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="m15 9-6 6m0-6 6 6m6-3c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                    </svg>
                                                </span>
                                            </span>
                                        </li>
                                        <li role="listitem" tabindex="0" aria-label="Another file with longer name 2MB" class="k-file-box">
                                            <span aria-hidden="true" class="k-icon k-svg-icon k-icon-xl k-svg-i-file-txt">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5V8.25L14.25 3h-9a.75.75 0 0 0-.75.75v6.75M14.25 3v5.25h5.25m-9.375 6 3.75 5.25m0-5.25-3.75 5.25m-2.25-5.25h-3.75m1.875 0v5.25m13.875-5.25h-3.75m1.875 0v5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                            <div class="k-file-info">
                                                <span class="k-file-name">Another file with longer name</span>
                                                <span class="k-file-size">2MB</span>
                                            </div>
                                            <span class="k-button k-button-xs k-button-flat k-icon-button" aria-hidden="true">
                                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x-circle" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="m15 9-6 6m0-6 6 6m6-3c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                    </svg>
                                                </span>
                                            </span>
                                        </li>
                                        <li role="listitem" tabindex="0" aria-label="Another file with even longer name 5MB" class="k-file-box">
                                            <span aria-hidden="true" class="k-icon k-svg-icon k-icon-xl k-svg-i-file-csv">
                                                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 18.8316A2.0742 2.0742 0 0 1 6 19.5c-1.2431 0-2.25-1.1756-2.25-2.625S4.7569 14.25 6 14.25a2.074 2.074 0 0 1 1.5.6684m5.6156-.5186s-2.7591-.7294-2.9813 1.0312 3.6028.9488 3.3544 2.88c-.2316 1.7963-2.9794 1.0313-2.9794 1.0313M19.5 10.5V8.25L14.25 3h-9a.75.75 0 0 0-.75.75v6.75M14.25 3v5.25h5.25m-3.75 6 1.875 5.25 1.875-5.25" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                </svg>
                                            </span>
                                            <div class="k-file-info">
                                                <span class="k-file-name">Another file with even longer name</span>
                                                <span class="k-file-size">5MB</span>
                                            </div>
                                            <span class="k-button k-button-xs k-button-flat k-icon-button" aria-hidden="true">
                                                <span class="k-button-icon k-icon k-svg-icon k-svg-i-x-circle" aria-hidden="true">
                                                    <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="m15 9-6 6m0-6 6 6m6-3c0 4.9706-4.0294 9-9 9s-9-4.0294-9-9 4.0294-9 9-9 9 4.0294 9 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                                    </svg>
                                                </span>
                                            </span>
                                        </li>
                                    </div>
                                </ul>
                            </div>
                            <div class="k-prompt-box-content">
                                <textarea class="k-prompt-box-textarea k-input-inner" aria-label="Prompt input" aria-multiline="true" placeholder="Type a message" rows="3"></textarea>
                                <div class="k-prompt-box-affix">
                                    <button class="k-button k-button-sm k-button-clear k-rounded-full k-icon-button" aria-label="Attach file">
                                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-paperclip" aria-hidden="true">
                                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.0005 7.5003 7.1901 15.44a1.5 1.5 0 0 0 .0159 2.1057 1.5 1.5 0 0 0 2.1057.015l9.3103-9.4388a3.0002 3.0002 0 1 0-4.2431-4.2431l-9.3103 9.4397a4.4999 4.4999 0 0 0 3.1894 7.6559 4.5 4.5 0 0 0 3.1743-1.2922l7.6932-7.6819" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                            </svg>
                                        </span>
                                    </button>
                                    <div class="k-spacer"></div>
                                    <button class="k-speech-to-text-button k-button k-button-sm k-button-flat k-rounded-full k-icon-button" aria-pressed="false" aria-label="Start listening">
                                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-microphone" aria-hidden="true">
                                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75v3.75m0-3.75a6.75 6.75 0 0 0 4.773-1.977A6.75 6.75 0 0 0 18.75 12M12 18.75A6.7503 6.7503 0 0 1 5.25 12M12 2.25c2.0711 0 3.75 1.679 3.75 3.75v6c0 2.0711-1.6789 3.75-3.75 3.75S8.25 14.0711 8.25 12V6c0-2.071 1.679-3.75 3.75-3.75" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                            </svg>
                                        </span>
                                    </button>
                                    <button class="k-button k-button-sm k-rounded-full k-disabled k-icon-button" aria-label="Send prompt" aria-live="polite" disabled="">
                                        <span class="k-button-icon k-icon k-svg-icon k-svg-i-arrow-up" aria-hidden="true">
                                            <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25V3.75m6.75 6.75L12 3.75 5.25 10.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                            </svg>
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
