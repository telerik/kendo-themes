<!doctype html>
<html lang="en" class="k-no-animations" style="--kendo-scrollbar-width: 15px;">
    <head>
        <title>Document</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" data-role="kendo-theme" href="/packages/meridian/dist/all.css">
        <link rel="stylesheet" data-role="kendo-theme-utils" href="/packages/utils/dist/all.css">
        <link rel="stylesheet" href="/packages/html/assets/styles.css">
        <script src="/packages/html/assets/scripts.js"></script>
    </head>
    <body id="app" class="k-body">
        <style>
            .k-animation-container,
            .k-popup {
            position: relative;
            overflow: visible;
            }
            .k-card-columnmenu-popup {
            width: 100%;
            }
        </style>
        <div id="test-area" class="k-d-grid k-grid-cols-4">
            <div class="k-animation-container k-animation-container-shown">
                <div class="k-child-animation-container">
                    <div class="k-card-columnmenu-popup k-popup">
                        <div class="k-column-menu">
                            <div class="k-columnmenu-item-wrapper">
                                <div class="k-columnmenu-item" role="button" tabindex="0">
                                    <span class="k-icon k-svg-icon k-svg-i-chevron-left" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.5 7.5 12 15 4.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                    Move to prev column
                                </div>
                                <div class="k-columnmenu-item" role="button" tabindex="0">
                                    <span class="k-icon k-svg-icon k-svg-i-chevron-right" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="m9 4.5 7.5 7.5L9 19.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                    Move to next column
                                </div>
                                <div class="k-columnmenu-item" role="button" tabindex="0">
                                    <span class="k-icon k-svg-icon k-svg-i-chevron-up" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15 12 7.5l7.5 7.5" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                    Move up
                                </div>
                                <div class="k-columnmenu-item" role="button" tabindex="0">
                                    <span class="k-icon k-svg-icon k-svg-i-chevron-down" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 9 12 16.5 4.5 9" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                    Move down
                                </div>
                                <div class="k-columnmenu-item" role="button" tabindex="0">
                                    <span class="k-icon k-svg-icon k-svg-i-caret-alt-to-top" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 18 7.5-7.5 7.5 7.5M4.5 6.75h15" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                    Move top
                                </div>
                                <div class="k-columnmenu-item" role="button" tabindex="0">
                                    <span class="k-icon k-svg-icon k-svg-i-caret-alt-to-bottom" aria-hidden="true">
                                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 6.75-7.5 7.5-7.5-7.5M4.5 18h15" fill="none" stroke-width="var(--kendo-icon-stroke-width, 1.5)"></path>
                                        </svg>
                                    </span>
                                    Move bottom
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
